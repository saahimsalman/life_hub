<meta name="theme-color" content="#1e201e" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="Saahim's personal life dashboard: tasks, calendar, finances, research, hobbies, gym, meals, habits, Islam, writing and reviews.">
<title>Saahim's Life Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%236f8f73%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2236%22%20fill%3D%22%23fffefb%22%3ES%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: fixed sidebar (desktop) / bottom nav (phone); calm editorial dashboard, one shared record system. */
:root{
  --bg:#f5f3ee; --surface:#fffefb; --surface-2:#efece5; --surface-3:#e7e3da;
  --text:#2a2a27; --muted:#6e6c65; --faint:#9c9a92; --line:#e3dfd6; --line-strong:#cfcac0;
  --accent:#6f8f73; --accent-ink:#4a6b4f; --accent-soft:#e5ede5; --accent-ring:rgba(111,143,115,.35);
  --danger:#a9564a; --danger-soft:#f3e3df; --warn:#9c7a33; --warn-soft:#f3ead6; --ok:#5f8963; --ok-soft:#e3ece3; --info:#587a95; --info-soft:#e1eaf0;
  --t-finance:#dfe8dc; --t-research:#dde5ee; --t-hobbies:#e9e0ec; --t-gym:#efe1d8; --t-food:#e8e9d4; --t-habits:#f0e9d6; --t-islam:#d9e9e6; --t-writing:#efdfe2; --t-personal:#e8e5df; --t-goals:#e3ebe0; --t-other:#e8e6e1;
  --shadow:0 1px 2px rgba(40,36,30,.05),0 6px 20px rgba(40,36,30,.05);
  --shadow-lg:0 12px 40px rgba(30,28,24,.16); --toast-accent:#a9c9ad;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --radius:14px; --radius-sm:9px; --sidebar:236px; --sidebar-min:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e201e; --surface:#262926; --surface-2:#2e322e; --surface-3:#363b36;
  --text:#ebe7de; --muted:#a8a49a; --faint:#7d7a72; --line:#373b37; --line-strong:#4a4f4a;
  --accent:#8db292; --accent-ink:#a9c9ad; --accent-soft:#2c3a2f; --accent-ring:rgba(141,178,146,.4);
  --danger:#d08b80; --danger-soft:#3c2b29; --warn:#d4b06a; --warn-soft:#3a3324; --ok:#8db292; --ok-soft:#2b3a2e; --info:#8fb0c8; --info-soft:#28333b;
  --t-finance:#2d3a2e; --t-research:#2c3540; --t-hobbies:#3a2f3c; --t-gym:#403129; --t-food:#363a26; --t-habits:#3d3625; --t-islam:#253b38; --t-writing:#3d2c30; --t-personal:#343330; --t-goals:#2d382c; --t-other:#333431;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5); --toast-accent:#4a6b4f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e201e; --surface:#262926; --surface-2:#2e322e; --surface-3:#363b36;
  --text:#ebe7de; --muted:#a8a49a; --faint:#7d7a72; --line:#373b37; --line-strong:#4a4f4a;
  --accent:#8db292; --accent-ink:#a9c9ad; --accent-soft:#2c3a2f; --accent-ring:rgba(141,178,146,.4);
  --danger:#d08b80; --danger-soft:#3c2b29; --warn:#d4b06a; --warn-soft:#3a3324; --ok:#8db292; --ok-soft:#2b3a2e; --info:#8fb0c8; --info-soft:#28333b;
  --t-finance:#2d3a2e; --t-research:#2c3540; --t-hobbies:#3a2f3c; --t-gym:#403129; --t-food:#363a26; --t-habits:#3d3625; --t-islam:#253b38; --t-writing:#3d2c30; --t-personal:#343330; --t-goals:#2d382c; --t-other:#333431;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5); --toast-accent:#4a6b4f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}h4{font-size:1rem;font-family:var(--font-body);font-weight:600}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
svg[aria-hidden="true"]{width:1em;height:1em;vertical-align:-.15em;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}.stack-s{display:flex;flex-direction:column;gap:6px}.stack-l{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row-nw{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}.grow{flex:1 1 auto;min-width:0}.wrap{flex-wrap:wrap}
.hidden,[hidden]{display:none!important}
.w100{width:100%}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prewrap{white-space:pre-wrap;word-break:break-word}
.mt{margin-top:12px}.mb{margin-bottom:12px}.mt-l{margin-top:24px}

/* ---------- shell ---------- */
.app{min-height:100vh}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20;transition:width .2s ease;overflow:hidden auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-family:var(--font-display);font-size:1.25rem;font-weight:500;white-space:nowrap}
.sidebar .brand .mark{width:28px;height:28px;border-radius:9px;background:var(--accent);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:1rem}
.nav-group{margin-top:10px}
.nav-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 12px 4px;font-weight:600;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border:0;background:none;width:100%;text-align:left;cursor:pointer;font-size:.93rem;min-height:38px}
.nav-item svg{width:18px;height:18px;flex:0 0 auto}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidebar.collapsed{width:var(--sidebar-min)}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .brand span,.sidebar.collapsed .nav-label,.sidebar.collapsed .sidebar-foot .segmented,.sidebar.collapsed .sidebar-foot .status-line{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0}
.main{margin-left:var(--sidebar);min-height:100vh;transition:margin .2s ease;display:flex;flex-direction:column}
.main.wide{margin-left:var(--sidebar-min)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:56px}
.topbar .title{font-family:var(--font-display);font-size:1.2rem;font-weight:500}
.status-line{font-size:.75rem;color:var(--faint);display:flex;align-items:center;gap:6px}
.status-line .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status-line.ok .dot{background:var(--ok)}.status-line.busy .dot{background:var(--warn)}.status-line.err .dot{background:var(--danger)}
.content{padding:22px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));max-width:1180px;width:100%;margin:0 auto}
@media (min-width:841px){.content{padding-bottom:48px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--muted);max-width:60ch}
.bottomnav{display:none}
@media (max-width:840px){
  .sidebar{display:none}
  .main{margin-left:0!important}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.68rem;font-weight:500;min-height:48px;cursor:pointer}
  .bottomnav button svg{width:21px;height:21px}
  .bottomnav button[aria-current="page"]{color:var(--accent-ink)}
  .bottomnav button.capture svg{width:24px;height:24px}
  .topbar .title{font-size:1.05rem}
  .topbar .status-line span:last-child{display:none}
  h1{font-size:1.6rem}
}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:12px 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:1.2rem}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;min-width:0}
.tile .v{font-family:var(--font-display);font-size:1.5rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:10px 0}
.subtle{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px}
.notice{border-radius:var(--radius-sm);padding:10px 14px;font-size:.88rem;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--text)}
.notice.info{background:var(--info-soft);border-color:transparent;color:var(--text)}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--text)}
.notice.danger{background:var(--danger-soft);border-color:transparent;color:var(--text)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;min-height:38px;white-space:nowrap;transition:background .12s,transform .08s,border-color .12s}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.82rem;border-radius:8px}
.btn.icon{padding:0;width:36px;min-width:36px;height:36px;min-height:36px;border-radius:10px}
.btn.icon.sm{width:30px;min-width:30px;height:30px;min-height:30px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);min-height:40px}
.textarea{min-height:90px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent-ring);outline-offset:0;border-color:var(--accent)}
.input.sm,.select.sm{min-height:32px;padding:4px 9px;font-size:.86rem;border-radius:8px}
.input.inline{border-color:transparent;background:transparent;padding-left:6px;padding-right:6px}
.input.inline:hover{background:var(--surface-2)}
.input.inline:focus{background:var(--surface)}
.input.display{font-family:var(--font-display);font-size:1.25rem;font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .help{font-size:.76rem;color:var(--faint)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form-grid .span{grid-column:1/-1}
.more-details{margin-top:4px}
.more-details>summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:.88rem;list-style:none;display:inline-flex;align-items:center;gap:6px}
.more-details>summary::-webkit-details-marker{display:none}
.more-details[open]>summary{margin-bottom:10px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;font-size:.9rem;min-height:30px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.segmented button{border:0;background:transparent;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:.84rem;font-weight:500;min-height:30px}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.84rem;font-weight:500;color:var(--muted);min-height:32px}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn .n{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.pill.area{color:var(--text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.due{background:var(--danger-soft);color:var(--danger)}
.pill.planned{background:var(--accent-soft);color:var(--accent-ink)}
.pill svg,.chipbtn svg{width:12px;height:12px}
.item .title svg.inl{width:14px;height:14px;vertical-align:-2px;color:var(--warn)}
.prio{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.prio.High{background:var(--danger)}.prio.Medium{background:var(--warn)}.prio.Low{background:var(--faint)}
.progress{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.progress.warn>i{background:var(--warn)}.progress.danger>i{background:var(--danger)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);min-height:44px}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:500;cursor:pointer;line-height:1.35;word-break:break-word}
.item .title:hover{color:var(--accent-ink)}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:.78rem;color:var(--muted)}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.item.dragging{opacity:.4}
.cb{appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);margin:2px 0 0;cursor:pointer;flex:0 0 auto;position:relative;background:var(--surface);transition:background .12s,border-color .12s}
.cb:hover{border-color:var(--accent)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb.sq{border-radius:6px}
.handle{color:var(--faint);cursor:grab;display:flex;align-items:center;padding:4px 0}
.handle svg{width:14px;height:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.table{width:100%;border-collapse:collapse;font-size:.9rem}
table.table th,table.table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.table th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.table tr:last-child td{border-bottom:0}
table.table td.r,table.table th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:28px;height:28px;color:var(--faint)}
.empty p{max-width:36ch}
.quickadd{display:flex;gap:8px;align-items:center}
.quickadd .input{flex:1}

/* ---------- area cards ---------- */
.area-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.area-card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--text);cursor:pointer;text-align:left;min-height:96px;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.area-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.area-card .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}

<body>
<div id="app" class="app" aria-live="polite"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ===== core.js ===== */
/* Saahim's Life Hub — core: utilities, dates, storage, sync, UI primitives, router */
'use strict';

/* ---------------- utilities ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const clone = o => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const CAD = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const money = n => CAD.format(Number(n) || 0);
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`;
const byKey = (k, dir = 1) => (a, b) => ((a[k] ?? '') > (b[k] ?? '') ? dir : (a[k] ?? '') < (b[k] ?? '') ? -dir : 0);
const nl2p = s => esc(s).replace(/\n/g, '<br>');
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');

/* ---------------- dates (YYYY-MM-DD strings, timezone-aware "today") ---------------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const D = {
  tz() { return (Store.ready && Settings.get().tz) || 'America/Edmonton'; },
  parts(date = new Date()) {
    try {
      const f = new Intl.DateTimeFormat('en-CA', { timeZone: D.tz(), year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      const o = {}; f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
      return { date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour === '24' ? '00' : o.hour}:${o.minute}` };
    } catch (e) { return { date: D.fromDate(date), time: `${pad(date.getHours())}:${pad(date.getMinutes())}` }; }
  },
  today() { return D.parts().date; },
  nowTime() { return D.parts().time; },
  fromDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
  valid(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  utcStr(t) { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; },
  add(s, n) { return D.utcStr(D.parse(s) + n * 86400000); },
  diff(a, b) { return Math.round((D.parse(a) - D.parse(b)) / 86400000); },
  dow(s) { return new Date(D.parse(s)).getUTCDay(); },
  weekStart(s) { const d = (D.dow(s) + 6) % 7; return D.add(s, -d); },
  weekKey(s) { return 'w' + D.weekStart(s); },
  monthKey(s) { return s.slice(0, 7); },
  monthStart(k) { return k + '-01'; },
  monthEnd(k) { const [y, m] = k.split('-').map(Number); return D.utcStr(Date.UTC(y, m, 0)); },
  addMonths(k, n) { const [y, m] = k.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}`; },
  monthLabel(k) { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; },
  fmt(s, style = 'short') {
    if (!D.valid(s)) return '';
    const d = new Date(D.parse(s)); const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate(), wd = d.getUTCDay();
    const thisYear = D.today().slice(0, 4) === String(y);
    if (style === 'short') return `${MONTHS[m].slice(0, 3)} ${day}${thisYear ? '' : ', ' + y}`;
    if (style === 'long') return `${DAYS[wd].slice(0, 3)}, ${MONTHS[m].slice(0, 3)} ${day}${thisYear ? '' : ', ' + y}`;
    if (style === 'full') return `${DAYS[wd]}, ${MONTHS[m]} ${day}, ${y}`;
    if (style === 'dayname') return DAYS[wd].slice(0, 3);
    return s;
  },
  rel(s) { if (!D.valid(s)) return ''; const t = D.today(); const diff = D.diff(s, t); if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday'; return D.fmt(s, 'short'); },
  fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const hh = h % 12 || 12; return `${hh}:${pad(m)} ${ap}`; },
  mins(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; },
  toTime(mins) { mins = ((mins % 1440) + 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; },
  range(a, b) { const out = []; let s = a; while (s <= b) { out.push(s); s = D.add(s, 1); } return out; },
};

/* ---------------- IndexedDB (local persistence) ---------------- */
const IDB = (() => {
  let dbp = null, broken = false;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('saahim-life-hub', 1);
        r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'key' }); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
    dbp.catch(() => { broken = true; });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store); const req = fn(s);
      t.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get broken() { return broken; },
    getAll: () => tx('records', 'readonly', s => s.getAll()),
    put: rec => tx('records', 'readwrite', s => s.put(rec)),
    del: key => tx('records', 'readwrite', s => s.delete(key)),
    clear: () => tx('records', 'readwrite', s => s.clear()),
    metaGet: async key => { const r = await tx('meta', 'readonly', s => s.get(key)); return r ? r.value : undefined; },
    metaPut: (key, value) => tx('meta', 'readwrite', s => s.put({ key, value })),
  };
})();

/* ---------------- Store: in-memory records, local persistence, change tracking ---------------- */
const Store = {
  data: {}, dirty: new Set(), ready: false, local: 'unknown', listeners: [],
  col(c) { if (!this.data[c]) this.data[c] = new Map(); return this.data[c]; },
  all(c, opts = {}) { const out = []; this.col(c).forEach(r => { if (!r.deleted || opts.deleted) out.push(r); }); return out; },
  get(c, id) { const r = this.col(c).get(id); return r && !r.deleted ? r : null; },
  raw(c, id) { return this.col(c).get(id) || null; },
  key(c, id) { return c + '/' + id; },
  async load() {
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('storage timeout')), ms));
    try {
      const rows = await Promise.race([IDB.getAll(), timeout(4000)]);
      rows.forEach(row => { const r = row.rec; if (r && r.col && r.id) this.col(r.col).set(r.id, r); });
      const dirty = await Promise.race([IDB.metaGet('dirty'), timeout(2000)]); if (Array.isArray(dirty)) dirty.forEach(k => this.dirty.add(k));
      this.local = 'ok';
    } catch (e) {
      console.warn('IndexedDB unavailable, falling back to localStorage', e);
      try { const raw = localStorage.getItem('hub.records'); if (raw) JSON.parse(raw).forEach(r => { if (r && r.col && r.id) this.col(r.col).set(r.id, r); }); const d = localStorage.getItem('hub.dirty'); if (d) JSON.parse(d).forEach(k => this.dirty.add(k)); localStorage.setItem('hub.probe', '1'); this.local = 'ls'; }
      catch (e2) { console.warn('No persistent storage', e2); this.local = 'none'; }
    }
    this.ready = true;
  },
  _lsTimer: null,
  _persist(rec) {
    if (this.local === 'ok') {
      IDB.put({ key: this.key(rec.col, rec.id), rec }).catch(e => { console.warn(e); this.local = 'error'; SaveStatus.refresh(); });
      IDB.metaPut('dirty', Array.from(this.dirty)).catch(() => {});
    } else if (this.local === 'ls') {
      clearTimeout(this._lsTimer);
      this._lsTimer = setTimeout(() => { try { const all = []; Object.keys(this.data).forEach(c => this.data[c].forEach(r => all.push(r))); localStorage.setItem('hub.records', JSON.stringify(all)); localStorage.setItem('hub.dirty', JSON.stringify(Array.from(this.dirty))); } catch (e) { console.warn(e); this.local = 'error'; SaveStatus.refresh(); } }, 300);
    }
  },
  put(c, rec, opts = {}) {
    rec = Object.assign({}, rec); rec.col = c; rec.id = rec.id || uid();
    if (!rec.createdAt) rec.createdAt = Date.now();
    rec.updatedAt = opts.keepTime && rec.updatedAt ? rec.updatedAt : Date.now();
    delete rec.deleted;
    this.col(c).set(rec.id, rec);
    this.dirty.add(this.key(c, rec.id)); this._persist(rec);
    if (!opts.silent) { Sync.schedule(); SaveStatus.saving(); bump(); }
    this.listeners.forEach(fn => { try { fn(c, rec); } catch (e) {} });
    return rec;
  },
  patch(c, id, fields, opts) { const r = this.raw(c, id); if (!r) return null; return this.put(c, Object.assign({}, r, fields), opts); },
  remove(c, id, opts = {}) {
    const r = this.raw(c, id); if (!r) return null;
    const dead = Object.assign({}, r, { deleted: true, updatedAt: Date.now() });
    this.col(c).set(id, dead); this.dirty.add(this.key(c, id)); this._persist(dead);
    if (!opts.silent) { Sync.schedule(); SaveStatus.saving(); bump(); }
    return r;
  },
  applyRemote(rec) {
    if (!rec || !rec.col || !rec.id) return;
    this.col(rec.col).set(rec.id, rec);
    this.dirty.delete(this.key(rec.col, rec.id));
    this._persist(rec);
  },
  async wipe() { this.data = {}; this.dirty.clear(); try { await IDB.clear(); await IDB.metaPut('dirty', []); } catch (e) {} try { localStorage.removeItem('hub.records'); localStorage.removeItem('hub.dirty'); } catch (e) {} },
  single(name) { return this.get('singles', name) || { col: 'singles', id: name }; },
  setSingle(name, fields, opts) { const cur = this.single(name); return this.put('singles', Object.assign({}, cur, fields, { id: name }), opts); },
};

/* ---------------- Sync: private per-user cloud store (claude.ai db capability) ---------------- */
const Sync = {
  backend: null, coll: null, status: 'off', detail: '', pushing: false, timer: null, unsub: null, started: false,
  standalone() { return !(window.claude && window.claude.use); },
  async init() {
    if (this.standalone()) { if (typeof Supa !== 'undefined' && Supa.signedIn()) { this.backend = 'supa'; return Supa.start(); } this.backend = null; this.status = 'off'; this.detail = 'Your data is saved in this browser on this device only. Turn on Cloud sync in Settings to see the same data on every device.'; SaveStatus.refresh(); return; }
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) { this.status = 'off'; this.detail = 'Saved on this device only. Open this page signed in to claude.ai (as a Contributor or above) to sync across devices.'; SaveStatus.refresh(); return; }
      const id = await user.id();
      if (!id) { this.status = 'off'; this.detail = 'Saved on this device only: no private cloud storage for this visit (not signed in).'; SaveStatus.refresh(); return; }
      this.coll = db.doc('data/users/' + id + '/hub').collection('records');
      this.status = 'syncing'; SaveStatus.refresh();
      await this.pull();
      this.subscribe();
      this.started = true;
      await this.push();
      this.status = this.dirty() ? 'error' : 'synced'; SaveStatus.refresh();
    } catch (e) { console.warn('sync init', e); this.status = 'error'; this.detail = e && e.message ? e.message : 'Could not reach the cloud store.'; SaveStatus.refresh(); }
  },
  dirty() { return Store.dirty.size > 0; },
  async pull() {
    const snap = await this.coll.get();
    let applied = 0;
    snap.docs.forEach(d => {
      const r = d.data(); if (!r || !r.col || !r.id) return;
      const local = Store.raw(r.col, r.id);
      const key = Store.key(r.col, r.id);
      if (!local) { Store.applyRemote(r); applied++; return; }
      if ((r.updatedAt || 0) > (local.updatedAt || 0)) { Store.applyRemote(r); applied++; }
      else if ((r.updatedAt || 0) === (local.updatedAt || 0)) Store.dirty.delete(key);
    });
    if (applied) bump();
  },
  subscribe() {
    try {
      const since = Date.now() - 60000;
      this.unsub = this.coll.where('updatedAt', '>', since).onSnapshot(snap => {
        let changed = 0;
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') return;
          const r = ch.doc.data(); if (!r || !r.col) return;
          const local = Store.raw(r.col, r.id);
          if (!local || (r.updatedAt || 0) > (local.updatedAt || 0)) { Store.applyRemote(r); changed++; }
        });
        if (changed) { bump(); toast('Updated from another device'); }
      }, err => { console.warn('sync listener', err); });
    } catch (e) { console.warn(e); }
  },
  schedule() { if (this.backend === 'supa') return Supa.schedule(); if (!this.coll) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.coll || this.pushing) return;
    this.pushing = true; this.status = 'syncing'; SaveStatus.refresh();
    try {
      for (const key of Array.from(Store.dirty)) {
        const i = key.indexOf('/'); const c = key.slice(0, i), id = key.slice(i + 1);
        const rec = Store.raw(c, id); if (!rec) { Store.dirty.delete(key); continue; }
        const docId = (c + '__' + id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');
        await this.coll.doc(docId).set(rec);
        Store.dirty.delete(key);
      }
      await IDB.metaPut('dirty', Array.from(Store.dirty)).catch(() => {});
      this.status = 'synced'; this.detail = '';
    } catch (e) {
      console.warn('push', e); this.status = 'error';
      this.detail = (e && e.code === 'quota_exceeded') ? 'Cloud storage is full. Remove large photos or old records.' : (e && e.message) || 'Sync failed; changes are kept on this device and retried later.';
      setTimeout(() => this.schedule(), 20000);
    }
    this.pushing = false; SaveStatus.refresh();
    if (Store.dirty.size && this.status === 'synced') this.schedule();
  },
};

/* ---------------- save status ---------------- */
const SaveStatus = {
  el: null, t: null,
  saving() { clearTimeout(this.t); this.render('busy', 'Saving…'); this.t = setTimeout(() => this.refresh(), 700); },
  refresh() {
    if (Store.local === 'none' || Store.local === 'error') return this.render('err', 'Not saved: storage blocked in this browser');
    if (Sync.status === 'synced') return this.render('ok', 'Saved & synced to your private store');
    if (Sync.status === 'syncing') return this.render('busy', 'Syncing…');
    if (Sync.status === 'error') return this.render('err', 'Saved on this device · sync paused');
    if (Store.local === 'ls') return this.render('ok', 'Saved in this browser (limited storage)');
    return this.render('ok', Sync.standalone() ? 'Saved in this browser' : 'Saved on this device only');
  },
  render(kind, text) { $$('.status-line').forEach(el => { el.className = 'status-line ' + kind; el.innerHTML = `<span class="dot"></span><span>${esc(text)}</span>`; el.title = Sync.detail || text; }); },
};

const Modal = {

    };

  ov.innerHTML = `<div class="search-panel" role="dialog" aria-label="Search"><input class="input" id="globalSearch" placeholder="Search tasks, projects, notes, papers, recipes, writing…" autocomplete="off"><div class="search-results" id="searchResults"><div class="empty small">Type to search everything.</div></div></div>`;
  document.body.appendChild(ov);
  const input = $('#globalSearch', ov), results = $('#searchResults', ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  let hits = [];
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { results.innerHTML = '<div class="empty small">Type at least two characters.</div>'; return; }
    hits = []; SearchSources.forEach(fn => { try { hits.push(...fn(q)); } catch (e) {} });
    hits = hits.slice(0, 40);
    results.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" data-i="${i}"><span class="k">${esc(h.kind)}</span><span class="grow truncate">${esc(h.title)}</span><span class="small faint">${esc(h.sub || '')}</span></button>`).join('') : '<div class="empty small">No matches.</div>';
  });
  results.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; close(); hits[+b.dataset.i].open(); });
  input.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { const b = $('button', results); if (b) b.focus(); e.preventDefault(); } if (e.key === 'Enter' && hits[0]) { close(); hits[0].open(); } });
  results.addEventListener('keydown', e => { const b = e.target.closest('button'); if (!b) return; if (e.key === 'ArrowDown' && b.nextElementSibling) { b.nextElementSibling.focus(); e.preventDefault(); } if (e.key === 'ArrowUp') { (b.previousElementSibling || input).focus(); e.preventDefault(); } });
  setTimeout(() => input.focus(), 20);
}
function matchText(q, ...fields) { return fields.some(f => String(f || '').toLowerCase().includes(q)); }

/* ---------------- drag & drop helper ---------------- */
function enableDnD(root, { item, zone, onDrop }) {
  if (!root) return;
  let dragId = null;
  root.addEventListener('dragstart', e => { const it = e.target.closest(item); if (!it) return; dragId = it.dataset.dragid; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
  root.addEventListener('dragend', e => { const it = e.target.closest(item); if (it) it.classList.remove('dragging'); $$('.over', root).forEach(z => z.classList.remove('over')); });
  root.addEventListener('dragover', e => { const z = e.target.closest(zone); if (!z) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; z.classList.add('over'); });
  root.addEventListener('dragleave', e => { const z = e.target.closest(zone); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  root.addEventListener('drop', e => { const z = e.target.closest(zone); if (!z) return; e.preventDefault(); z.classList.remove('over'); const id = dragId || e.dataTransfer.getData('text/plain'); if (id) onDrop(id, z.dataset.zone, z); dragId = null; });
}

/* ---------------- media (images as compressed data URLs) ---------------- */
function readImageFile(file, maxPx = 1000) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Choose an image file'));
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height; const s = Math.min(1, maxPx / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 190000 && q > 0.35) { q -= 0.12; out = c.toDataURL('image/jpeg', q); }
      if (out.length > 200000) return rej(new Error('Image is too large even after shrinking; try a smaller one.'));
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
    img.src = url;
  });
}
function pickImage(onReady, maxPx) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { const d = await readImageFile(f, maxPx); onReady(d); } catch (e) { toast(e.message); } };
  inp.click();
}

/* ===== supa.js ===== */
/* Cloud sync for the standalone app: your own private Supabase database.
   Talks to Supabase's REST endpoints directly (no extra library).
   Every row is locked to the signed-in user by row-level security. */
'use strict';

const Supa = {
  KEY: 'hub.supa', SINCE: 'hub.supa.since',
  timer: null, poll: null, busy: false, again: false, lastSync: 0,
  cfg() { try { return JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { return null; } },
  save(c) { try { localStorage.setItem(this.KEY, JSON.stringify(c)); } catch (e) {} },
  signedIn() { const c = this.cfg(); return !!(c && c.url && c.key && c.refresh); },
  base(c) { return c.url.trim().replace(/\/+$/, ''); },
  async authCall(c, path, body) {
    let r; try { r = await fetch(this.base(c) + '/auth/v1/' + path, { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw new Error('Could not reach Supabase. Check the Project URL and your internet connection.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const msg = j.error_description || j.msg || j.message || j.error || ''; const err = new Error(/invalid api key|no api key/i.test(msg) ? 'Supabase rejected the key. Copy the publishable (or anon) key again.' : /invalid login/i.test(msg) ? 'Email or password is wrong.' : /not confirmed/i.test(msg) ? 'This email is not confirmed yet. Click the link Supabase emailed you, or turn off "Confirm email" (setup step 4), then sign in.' : (msg || 'Supabase said no (' + r.status + ').')); err.status = r.status; throw err; }
    return j;
  },
  setSession(c, s) { c.access = s.access_token; c.refresh = s.refresh_token; c.exp = Date.now() + (s.expires_in || 3600) * 1000; c.userId = (s.user && s.user.id) || c.userId; this.save(c); },
  async signIn({ url, key, email, password, create }) {
    url = (url || '').trim(); key = (key || '').trim(); email = (email || '').trim();
    if (!/^https:\/\/.+/.test(url)) throw new Error('The Project URL should start with https:// (e.g. https://abcd1234.supabase.co).');
    if (!key) throw new Error('Paste the publishable (or anon) key.');
    if (!email || !password) throw new Error('Enter your email and a password.');
    const c = { url, key, email };
    if (create) {
      const s = await this.authCall(c, 'signup', { email, password });
      if (!s.access_token) throw new Error('Account created. Supabase wants the email confirmed first: click the link in the email it sent (or turn off "Confirm email", setup step 4), then tap Sign in.');
      this.setSession(c, s);
    } else this.setSession(c, await this.authCall(c, 'token?grant_type=password', { email, password }));
    try { localStorage.removeItem(this.SINCE); } catch (e) {}
    return c;
  },
  signOut() { const c = this.cfg(); if (c) { delete c.access; delete c.refresh; delete c.exp; this.save(c); } clearInterval(this.poll); Sync.backend = null; Sync.status = 'off'; Sync.detail = 'Signed out of cloud sync. Data stays on this device.'; SaveStatus.refresh(); bump(); },
  async token(force) {
    const c = this.cfg(); if (!c || !c.refresh) throw Object.assign(new Error('Signed out'), { signedOut: true });
    if (!force && c.access && c.exp - 60000 > Date.now()) return c.access;
    try { this.setSession(c, await this.authCall(c, 'token?grant_type=refresh_token', { refresh_token: c.refresh })); return c.access; }
    catch (e) { if (e.status === 400 || e.status === 401) { this.signOut(); throw Object.assign(new Error('Your sign-in expired. Sign in again under Settings → Cloud sync.'), { signedOut: true }); } throw e; }
  },
  async rest(method, pathQuery, body, prefer) {
    const c = this.cfg();
    for (let attempt = 0; attempt < 2; attempt++) {
      const tok = await this.token(attempt > 0);
      const headers = { apikey: c.key, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }; if (prefer) headers.Prefer = prefer;
      let r; try { r = await fetch(this.base(c) + '/rest/v1/' + pathQuery, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
      catch (e) { throw new Error('Offline or Supabase unreachable — changes are kept on this device and sent later.'); }
      if (r.status === 401 && attempt === 0) continue;
      if (!r.ok) { const j = await r.json().catch(() => ({})); const msg = j.message || j.hint || ('HTTP ' + r.status); throw new Error(/relation .*records.* does not exist|Could not find the table/i.test(msg) ? 'The "records" table is missing. Run the setup SQL (step 3) in Supabase.' : msg); }
      return r.status === 204 ? null : r.json().catch(() => null);
    }
  },
  async pull() {
    let since = ''; try { since = localStorage.getItem(this.SINCE) || ''; } catch (e) {}
    let offset = 0, newest = since, applied = 0;
    for (;;) {
      const filter = since ? '&synced_at=gt.' + encodeURIComponent(new Date(Date.parse(since) - 5000).toISOString()) : '';
      const rows = await this.rest('GET', `records?select=col,id,data,updated_at,synced_at${filter}&order=synced_at.asc,id.asc&limit=500&offset=${offset}`);
      (rows || []).forEach(row => {
        const r = row.data; if (!r || !r.col || !r.id) return;
        const local = Store.raw(r.col, r.id);
        if (!local || (r.updatedAt || 0) > (local.updatedAt || 0)) { Store.applyRemote(r); applied++; }
        else if ((r.updatedAt || 0) === (local.updatedAt || 0)) Store.dirty.delete(Store.key(r.col, r.id));
        if (!newest || row.synced_at > newest) newest = row.synced_at;
      });
      if (!rows || rows.length < 500) break; offset += 500;
    }
    if (newest) try { localStorage.setItem(this.SINCE, newest); } catch (e) {}
    return applied;
  },
  async push() {
    const c = this.cfg(); const keys = Array.from(Store.dirty); if (!keys.length) return 0;
    let batch = [], size = 0, sent = 0;
    const flush = async () => { if (!batch.length) return; await this.rest('POST', 'records?on_conflict=user_id,col,id', batch.map(b => b.row), 'resolution=merge-duplicates,return=minimal'); batch.forEach(b => Store.dirty.delete(b.key)); sent += batch.length; batch = []; size = 0; };
    for (const key of keys) {
      const i = key.indexOf('/'); const rec = Store.raw(key.slice(0, i), key.slice(i + 1));
      if (!rec) { Store.dirty.delete(key); continue; }
      const row = { user_id: c.userId, col: rec.col, id: rec.id, data: rec, updated_at: rec.updatedAt || 0 };
      const n = JSON.stringify(row).length;
      if (size + n > 1500000) await flush();
      batch.push({ key, row }); size += n;
      if (batch.length >= 200) await flush();
    }
    await flush();
    this.saveDirty();
    return sent;
  },
  saveDirty() { if (Store.local === 'ok') IDB.metaPut('dirty', Array.from(Store.dirty)).catch(() => {}); else if (Store.local === 'ls') try { localStorage.setItem('hub.dirty', JSON.stringify(Array.from(Store.dirty))); } catch (e) {} },
  async sync(opts = {}) {
    if (!this.signedIn()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; Sync.status = 'syncing'; SaveStatus.refresh();
    try {
      const applied = await this.pull();
      await this.push();
      Sync.status = 'synced'; Sync.detail = ''; this.lastSync = Date.now();
      if (applied) { bump(); if (opts.announce) toast(`Updated ${plural(applied, 'item')} from your other devices`); }
    } catch (e) {
      console.warn('cloud sync', e); Sync.status = e.signedOut ? 'off' : 'error'; Sync.detail = e.message || 'Sync failed; changes are kept on this device.';
      if (!e.signedOut) { clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 30000); }
    }
    this.busy = false; SaveStatus.refresh();
    if (this.again) { this.again = false; this.schedule(); }
  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 1200); },
  start() {
    Sync.backend = 'supa';
    this.sync({ announce: true });
    clearInterval(this.poll);
    this.poll = setInterval(() => { if (!document.hidden) this.sync({ announce: true }); }, 60000);
    if (!this._vis) { this._vis = true; document.addEventListener('visibilitychange', () => { if (!document.hidden && Sync.backend === 'supa') this.sync({ announce: true }); }); window.addEventListener('online', () => { if (Sync.backend === 'supa') this.sync(); }); }
  },
};

/* ===== tasks.js ===== */
/* Tasks, projects, notes — the shared record system used by every section */
'use strict';

/* ---------- recurrence (shared by tasks and calendar events) ---------- */
const Recur = {
  freqOptions: [{ value: '', label: 'Does not repeat' }, { value: 'daily', label: 'Daily' }, { value: 'weekly', label: 'Weekly' }, { value: 'monthly', label: 'Monthly' }, { value: 'yearly', label: 'Yearly' }],
  active(r) { return r && r.recur && r.recur.freq; },
  describe(r) {
    if (!Recur.active(r)) return ''; const rc = r.recur; const n = rc.interval > 1 ? `every ${rc.interval} ` : 'every ';
    const unit = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' }[rc.freq];
    let s = n + unit + (rc.interval > 1 ? 's' : '');
    if (rc.freq === 'weekly' && rc.days && rc.days.length) s += ' on ' + rc.days.map(d => DAYS[d].slice(0, 3)).join(', ');
    if (rc.until) s += ' until ' + D.fmt(rc.until); return s;
  },
  occursOn(rec, date) {
    const start = rec.date || rec.plannedDate; if (!start || !D.valid(start)) return false;
    if (!Recur.active(rec)) return date === start;
    const rc = rec.recur; const iv = Math.max(1, rc.interval || 1);
    if (date < start) return false; if (rc.until && date > rc.until) return false;
    if (rec.ex && rec.ex[date] && (rec.ex[date].skip || (rec.ex[date].date && rec.ex[date].date !== date))) return false;
    if (rc.freq === 'daily') return D.diff(date, start) % iv === 0;
    if (rc.freq === 'weekly') { const days = rc.days && rc.days.length ? rc.days : [D.dow(start)]; if (!days.includes(D.dow(date))) return false; const w = Math.floor(D.diff(D.weekStart(date), D.weekStart(start)) / 7); return w % iv === 0; }
    if (rc.freq === 'monthly') { if (date.slice(8) !== start.slice(8)) return false; const m = (+date.slice(0, 4) - +start.slice(0, 4)) * 12 + (+date.slice(5, 7) - +start.slice(5, 7)); return m % iv === 0; }
    if (rc.freq === 'yearly') { if (date.slice(5) !== start.slice(5)) return false; return (+date.slice(0, 4) - +start.slice(0, 4)) % iv === 0; }
    return false;
  },
  /* occurrence object for a date, applying one-off overrides */
  instance(rec, date) { const ov = rec.ex && rec.ex[date] && !rec.ex[date].skip ? rec.ex[date] : {}; const inst = Object.assign({}, rec, ov, { occDate: ov.date || date, occKey: date, baseId: rec.id }); if (rec.plannedDate && ov.date) inst.plannedDate = ov.date; return inst; },
  expand(rec, from, to) {
    const out = []; if (!Recur.active(rec)) { const d = rec.date || rec.plannedDate; if (d && d >= from && d <= to) out.push(Recur.instance(rec, d)); return out; }
    let d = from; while (d <= to) { if (Recur.occursOn(rec, d)) out.push(Recur.instance(rec, d)); d = D.add(d, 1); }
    Object.keys(rec.ex || {}).forEach(k => { const o = rec.ex[k]; if (o && !o.skip && o.date && o.date !== k && o.date >= from && o.date <= to && (!rec.recur.until || k <= rec.recur.until)) out.push(Recur.instance(rec, k)); });
    return out.sort(byKey('occDate'));
  },
  fields(prefix = '') { return [
    { key: 'recur_freq', label: 'Repeats', type: 'select', options: Recur.freqOptions, more: true },
    { key: 'recur_interval', label: 'Every (n)', type: 'number', min: 1, step: 1, more: true, help: 'e.g. 2 = every second week' },
    { key: 'recur_days', label: 'Weekdays (weekly)', type: 'multiselect', options: [1, 2, 3, 4, 5, 6, 0].map(d => ({ value: String(d), label: DAYS[d].slice(0, 3) })), more: true },
    { key: 'recur_until', label: 'Repeat until', type: 'date', more: true },
  ]; },
  fromForm(vals, existing) {
    const recur = vals.recur_freq ? { freq: vals.recur_freq, interval: Math.max(1, Number(vals.recur_interval) || 1), days: (vals.recur_days || []).map(Number), until: vals.recur_until || '' } : null;
    ['recur_freq', 'recur_interval', 'recur_days', 'recur_until'].forEach(k => delete vals[k]);
    vals.recur = recur; if (!recur) { vals.ex = null; }
    return vals;
  },
  toForm(rec) { const rc = rec.recur || {}; return { recur_freq: rc.freq || '', recur_interval: rc.interval || 1, recur_days: (rc.days || []).map(String), recur_until: rc.until || '' }; },
  /* split a series: original ends the day before `date`, new series starts at `date` with changes */
  splitFuture(col, rec, date, changes) {
    const until = D.add(date, -1);
    if (until < (rec.date || rec.plannedDate)) { Store.put(col, Object.assign({}, rec, changes, { date: rec.date ? (changes.date || date) : undefined, plannedDate: rec.plannedDate ? (changes.plannedDate || date) : undefined })); return; }
    Store.patch(col, rec.id, { recur: Object.assign({}, rec.recur, { until }) });
    const next = Object.assign({}, rec, { id: undefined, ex: null, doneDates: [] }, changes);
    if (rec.date) next.date = changes.date || date; if (rec.plannedDate) next.plannedDate = changes.plannedDate || date;
    next.recur = Object.assign({}, rec.recur, { until: rec.recur.until || '' });
    Store.put(col, next);
  },

function reminderMinutes(r) { if (!r || r.reminder === '' || r.reminder == null) return null; if (r.reminder === 'custom') return Math.max(0, Number(r.reminderCustom) || 0); return Number(r.reminder); }

const Tasks = {
  all() { return Store.all('tasks').filter(t => !t.archived); },
  open() { return Tasks.all().filter(t => t.status !== 'Done'); },
  byProject(pid) { return Store.all('tasks').filter(t => t.projectId === pid); },
  isDoneOn(t, date) { if (Recur.active(t)) return (t.doneDates || []).includes(t.occKey || date); return t.status === 'Done'; },
  occursOn(t, date) { return t.plannedDate && Recur.occursOn(Object.assign({}, t, { date: t.plannedDate }), date); },
  forDate(date) { const out = []; Tasks.all().forEach(t => { if (Recur.active(t)) { if (t.plannedDate) Recur.expand(Object.assign({}, t, { date: t.plannedDate }), date, date).forEach(i => out.push(i)); } else if (t.plannedDate === date || t.dueDate === date) out.push(t); }); return out; },
  todayList(date = D.today()) { const list = Tasks.forDate(date).filter(t => !Tasks.isDoneOn(t, date)); const focus = Tasks.open().filter(t => t.focusDate === date && !list.find(x => x.id === t.id)); return focus.concat(list); },
  overdue(today = D.today()) { return Tasks.open().filter(t => !Recur.active(t) && ((t.plannedDate && t.plannedDate < today) || (t.dueDate && t.dueDate < today))); },
  deadlines(from, to) { return Tasks.open().filter(t => t.dueDate && t.dueDate >= from && t.dueDate <= to).sort(byKey('dueDate')); },

    Store.patch('tasks', id, { status: was ? (t.prevStatus || 'Next') : 'Done', prevStatus: was ? null : prev, completedAt: was ? null : Date.now(), focusDate: was ? t.focusDate : null });

};
function taskRow(t, opts = {}) {

/* ---------- reminders ---------- */
const Reminders = {
  timer: null,
  support() { if (!('Notification' in window)) return { ok: false, label: 'Not available in this browser or frame', cls: 'warn' }; const p = Notification.permission; if (p === 'granted') return { ok: true, label: 'Allowed in this browser', cls: 'ok' }; if (p === 'denied') return { ok: false, label: 'Blocked by the browser', cls: 'danger' }; return { ok: false, label: 'Permission not asked yet', cls: '' }; },
  start() { clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 30000); this.tick(); },
  tick() {
    if (!Store.ready) return;
    const today = D.today(); const items = calendarItems(D.add(today, -1), D.add(today, 2)).filter(it => it.reminder != null && !it.done);
    const now = Date.now();
    items.forEach(it => {
      const at = this.fireTime(it); if (!at) return;
      const key = it.occKey || it.date; const st = (it.rec.reminderState || {}); if (st.firedKey === key) return;
      if (now >= at && now - at < 3 * 60000) this.fire(it, key);
      else if (now - at >= 3 * 60000) Store.patch(it.rec.col, it.baseId, { reminderState: { status: 'missed', firedKey: key, at: now } }, { silent: true });
    });
  },
  fireTime(it) { const t = it.allDay || !it.startTime ? '09:00' : it.startTime; const [y, m, d] = it.date.split('-').map(Number); const [hh, mm] = t.split(':').map(Number); const local = new Date(y, m - 1, d, hh, mm).getTime(); return local - it.reminder * 60000; },
  fire(it, key) {
    const body = `${it.allDay ? 'Today' : D.fmtTime(it.startTime)} · ${areaLabel(it.area)}`; let status = 'delivered';
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification(it.title, { body, tag: it.baseId + key }); else status = 'failed'; } catch (e) { status = 'failed'; }
    toast(`Reminder: ${it.title} (${body})`, { ms: 12000 });
    Store.patch(it.rec.col, it.baseId, { reminderState: { status, firedKey: key, at: Date.now() } }, { silent: true });
  },
  async request() { if (!('Notification' in window)) { toast('Notifications are not available here'); return; } try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Notifications allowed' : 'Notifications not allowed'); } catch (e) { toast('Could not request permission in this frame'); } bump(); },
  test() { try { if ('Notification' in window && Notification.permission === 'granted') { new Notification("Saahim's Life Hub", { body: 'Test notification — reminders will look like this while the page is open.' }); toast('Test notification sent'); } else toast('Browser notifications are not allowed here; reminders will show as in-app toasts only.'); } catch (e) { toast('Notification failed: ' + e.message); } },
};
Object.assign(Actions, {
  calReminders() {
    const s = Reminders.support(); const today = D.today(); const upcoming = calendarItems(today, D.add(today, 7)).filter(it => it.reminder != null);
    Modal.open({ title: 'Reminders', html: `<div class="stack">
      <div class="notice ${s.cls}"><strong>Browser notifications:</strong> ${esc(s.label)}.</div>
      <div class="row"><button class="btn" type="button" data-act="remAsk">${icon('bell')} Ask permission</button><button class="btn" type="button" data-act="remTest">Send test notification</button></div>
      <div class="notice warn">Reminders here fire <strong>only while this page is open</strong> in a tab. There is no background scheduler or push service in this app, so a closed tab means no reminder. For reliable alerts on your phone, add the item to your phone's calendar (each event has an <em>Add to Google Calendar</em> link) or import the .ics file below.</div>
      <div class="row"><button class="btn" type="button" data-act="remIcs">${icon('download')} .ics for the next 60 days</button></div>

/* ---------- export: Google Calendar link & ICS ---------- */
function gcalLink(it) {
  const tz = D.tz(); const d = it.date.replace(/-/g, '');
  const dates = it.allDay || !it.startTime ? `${d}/${D.add(it.date, 1).replace(/-/g, '')}` : `${d}T${it.startTime.replace(':', '')}00/${d}T${(it.endTime || D.toTime(D.mins(it.startTime) + 60)).replace(':', '')}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(it.title)}&dates=${dates}&ctz=${encodeURIComponent(tz)}&details=${encodeURIComponent((it.notes || '') + '\n(from Life Hub)')}${it.location ? '&location=' + encodeURIComponent(it.location) : ''}`;
}
function icsText(items) {
  const esc_ = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const tz = D.tz(); const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Saahim Life Hub//EN', 'CALSCALE:GREGORIAN'];
  items.forEach(it => {
    const d = it.date.replace(/-/g, '');
    lines.push('BEGIN:VEVENT', `UID:${it.baseId}-${it.occKey || it.date}@lifehub`, `DTSTAMP:${stamp}`, `SUMMARY:${esc_(it.title)}`);
    if (it.allDay || !it.startTime) { lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${D.add(it.date, 1).replace(/-/g, '')}`); }
    else { lines.push(`DTSTART;TZID=${tz}:${d}T${it.startTime.replace(':', '')}00`, `DTEND;TZID=${tz}:${d}T${(it.endTime || D.toTime(D.mins(it.startTime) + 60)).replace(':', '')}00`); }
    if (it.location) lines.push(`LOCATION:${esc_(it.location)}`); if (it.notes) lines.push(`DESCRIPTION:${esc_(it.notes)}`);
    if (it.reminder != null) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc_(it.title)}`, `TRIGGER:-PT${it.reminder}M`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR'); return lines.join('\r\n');
}
async function exportIcs(items, name) { await offerDownload(`${slug(name)}.ics`, icsText(items), 'Calendar file (.ics)'); }
async function offerDownload(filename, text, label) {
  let dl = null; try { dl = window.claude && window.claude.use ? await claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename, data: text }); toast('Download offered'); return; } catch (e) { if (e && e.code === 'declined') return; } }
  if (Sync.standalone()) { try { const blob = new Blob([text], { type: filename.endsWith('.ics') ? 'text/calendar' : 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000); toast(`Downloading ${filename}`); return; } catch (e) { console.warn(e); } }
  Modal.open({ title: label || filename, html: `<p class="small muted mb">Direct downloads aren't available here, so copy this text and save it as <code>${esc(filename)}</code>.</p><textarea class="textarea" id="dlText" rows="10" readonly>${esc(text)}</textarea>`, foot: `<button class="btn" type="button" data-close>Close</button><button class="btn primary" type="button" data-act="copy" data-sel="#dlText">${icon('copy')} Copy</button>` });
}

const Fin = {
  month() { return UI.get('finMonth') || D.monthKey(D.today()); },
  tx(month) { return Store.all('transactions').filter(t => D.monthKey(t.date) === month); },
  signed(t) { return t.type === 'Expense' && t.refund ? -t.amount : t.amount; },
  totals(month) { const tx = Fin.tx(month); const income = tx.filter(t => t.type === 'Income').reduce((s, t) => s + (t.amount || 0), 0); const spending = tx.filter(t => t.type === 'Expense').reduce((s, t) => s + Fin.signed(t), 0); return { income, spending, net: income - spending, count: tx.length }; },
  catActual(month, cat) { return Fin.tx(month).filter(t => t.type === 'Expense' && t.category === cat).reduce((s, t) => s + Fin.signed(t), 0); },
  budgetId(month, cat) { return month + '_' + slug(cat); },
  budget(month, cat) { return Store.get('budgets', Fin.budgetId(month, cat)); },
  budgetRows(month) { return categories().map(cat => { const b = Fin.budget(month, cat); const planned = b ? (b.planned || 0) : 0; const actual = Fin.catActual(month, cat); return { cat, planned, actual, remaining: planned - actual, pct: planned ? actual / planned * 100 : 0, has: !!b }; }); },
  upcomingBills(days = 30) { const t = D.today(), e = D.add(t, days); return Store.all('bills').filter(b => b.active !== false && b.nextDate && b.nextDate <= e).sort(byKey('nextDate')); },
  advance(date, freq) { switch (freq) { case 'Weekly': return D.add(date, 7); case 'Every 2 weeks': return D.add(date, 14); case 'Quarterly': return D.monthStart(D.addMonths(D.monthKey(date), 3)).slice(0, 8) + date.slice(8); case 'Yearly': return (+date.slice(0, 4) + 1) + date.slice(4); default: { const k = D.addMonths(D.monthKey(date), 1); const last = D.monthEnd(k); const day = Math.min(+date.slice(8), +last.slice(8)); return k + '-' + pad(day); } } },

  const qs = [['surprise', 'What surprised me this month?'], ['bigger', 'What cost more than expected, and why?'], ['subs', 'Subscriptions or bills to review or cancel'], ['savings', 'How did savings goals move?'], ['adjust', 'What will I adjust next month?'], ['decision', 'One money decision for next month']];
  return `<div class="card stack"><div class="row between"><h3>Money review — ${esc(D.monthLabel(month))}</h3><span class="small muted">About 10 minutes</span></div>
    <div class="tiles"><div class="tile"><div class="l">Income</div><div class="v">${money(t.income)}</div></div><div class="tile"><div class="l">Spending</div><div class="v">${money(t.spending)}</div></div><div class="tile"><div class="l">Net</div><div class="v" style="color:${t.net < 0 ? 'var(--danger)' : 'inherit'}">${money(t.net)}</div></div></div>
    <div class="form-grid">${qs.map(([k, q]) => `<div class="field span"><label for="mr_${k}">${esc(q)}</label><textarea class="textarea" id="mr_${k}" rows="2" data-mreview="${k}">${esc(r[k] || '')}</textarea></div>`).join('')}</div>
    <div class="row between"><span class="small muted">${r.updatedAt ? 'Saved ' + new Date(r.updatedAt).toLocaleDateString() : 'Saves as you type'}</span></div></div>`;
}

function compareTable(ids) {
  const exps = ids.map(id => Store.get('experiments', id)).filter(Boolean); if (exps.length < 2) return '';
  const diff = key => new Set(exps.map(e => (e[key] || '').trim())).size > 1;
  const warn = diff('cohort') || diff('split') || diff('preproc');
  const rows = [['status', 'Status'], ['question', 'Question'], ['cohort', 'Cohort'], ['split', 'Split / validation'], ['preproc', 'Preprocessing'], ['model', 'Model'], ['config', 'Config'], ['changed', 'What changed'], ['metrics', 'Metrics'], ['happened', 'What happened'], ['interpretation', 'Suggests'], ['nextStep', 'Next'], ['commit', 'Commit'], ['output', 'Outputs']];
  return `<div class="card stack"><div class="row between"><h3>Side-by-side comparison</h3><button class="btn ghost sm" type="button" data-act="expClearCompare">Clear</button></div>
    ${warn ? `<div class="notice warn">${diff('cohort') ? 'Cohorts differ. ' : ''}${diff('split') ? 'Validation strategies differ. ' : ''}${diff('preproc') ? 'Preprocessing differs. ' : ''}Metrics are <strong>not directly comparable</strong> across these runs.</div>` : '<div class="notice ok">Same cohort, split and preprocessing recorded — metrics can be compared.</div>'}

}

function openCheckIn(date) {
  const h = Modal.open({ title: `Check-in · ${D.rel(date)}`, html: `<div id="checkinBody">${checkInHtml(date)}</div>`, foot: `<div class="left"><button class="btn ghost sm" type="button" data-ci="${D.add(date, -1)}">${icon('chevronl')} ${esc(D.rel(D.add(date, -1)))}</button></div><button class="btn primary" type="button" data-close>Done</button>` });
  const rerender = () => { const body = $('#checkinBody', h.el); if (!body) return; const act = document.activeElement; if (act && act.tagName === 'INPUT' && body.contains(act)) return; body.innerHTML = checkInHtml(date); };

}

function openEditor(id) {
  const p = Store.get('pieces', id); if (!p) return;
  const ov = document.createElement('div'); ov.className = 'editor-overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Writing editor');
  const words = t => (t || '').trim().split(/\s+/).filter(Boolean).length;
  ov.innerHTML = `<div class="editor-bar"><button class="btn icon ghost" type="button" id="edClose" aria-label="Close editor">${icon('x')}</button><span class="small muted grow" id="edStatus">${words(p.draft)} words · saved</span><select class="select sm" style="width:auto" id="edStage" aria-label="Stage">${optList(STAGES, p.stage)}</select><button class="btn sm" type="button" id="edDetails">${icon('edit')} Details</button></div>

  document.body.appendChild(ov);
  const body = $('#edBody', ov), title = $('#edTitle', ov), status = $('#edStatus', ov);
  const save = debounce(() => { Store.patch('pieces', id, { draft: body.value, title: title.value.trim() || p.title, stage: $('#edStage', ov).value }, { silent: true }); Sync.schedule(); status.textContent = `${words(body.value)} words · saved`; SaveStatus.saving(); }, 700);
  const dirty = () => { status.textContent = `${words(body.value)} words · saving…`; save(); };
  body.addEventListener('input', dirty); title.addEventListener('input', dirty); $('#edStage', ov).addEventListener('change', () => { dirty(); });
  const close = () => { save.flush && save.flush(); Store.patch('pieces', id, { draft: body.value, title: title.value.trim() || p.title, stage: $('#edStage', ov).value }); ov.remove(); };
  $('#edClose', ov).onclick = close; $('#edDetails', ov).onclick = () => { close(); openRecord('pieces', id); };

  return `<div class="card stack"><div class="row-nw between"><div><div class="eyebrow">Today</div><h2>${esc(D.fmt(today, 'full'))}</h2></div><button class="btn sm" type="button" data-act="checkIn">${icon('sun')} Check-in${habits.length ? ` <span class="faint num">${done}/${habits.length}</span>` : ''}</button></div>
