    ${focus.length ? `<div><div class="eyebrow mb">Priorities</div><div class="list">${focus.map(t => taskRow(t)).join('')}</div></div>` : `<div class="notice">No priorities chosen. Open a task's menu and pick <em>Make today's priority</em> (up to three).</div>`}
    <div><div class="row-nw between mb"><div class="eyebrow">Tasks</div><button class="btn ghost sm" type="button" data-act="nav" data-page="tasks">All tasks ${icon('chevron')}</button></div><div class="quickadd mb"><input class="input sm" id="qa_home" placeholder="Add a task for today…" data-enter="taskQuickAdd" data-planned="today" data-status="Next"><button class="btn sm primary" type="button" data-act="taskQuickAdd" data-planned="today" data-status="Next">${icon('plus')}</button></div><div class="list">${rest.length ? rest.map(t => taskRow(t)).join('') : '<p class="small muted">Nothing else planned for today.</p>'}</div></div>
    ${overdue.length ? `<details ${UI.get('odOpen') ? 'open' : ''}><summary class="small" style="cursor:pointer;color:var(--danger)">${overdue.length} overdue</summary><div class="list">${overdue.map(t => taskRow(t)).join('')}</div></details>` : ''}
    <div><div class="eyebrow mb">Scheduled</div>${sched.length ? `<div class="stack-s">${sched.map(it => `<div class="row-nw small"><span class="pill ${it.kind === 'task' ? 'planned' : 'accent'}" style="min-width:66px;justify-content:center">${it.allDay ? 'All day' : D.fmtTime(it.startTime)}</span><span class="title grow" data-act="calOpen" data-kind="${it.kind}" data-id="${it.baseId}" data-date="${it.date}" data-key="${it.occKey || it.date}" style="cursor:pointer">${esc(it.title)}</span>${areaChip(it.area)}</div>`).join('')}</div>` : '<p class="small muted">No timed items today. <button class="btn ghost sm" type="button" data-act="new" data-col="events">Add one</button></p>'}</div></div>`;
}
function homeWeek() {
  const today = D.today(); const ws = D.weekStart(today); const we = D.add(ws, 6); const w = Store.get('weeks', 'w' + ws) || {};
  const deadlines = Tasks.deadlines(today, D.add(today, 7)); const projects = Projects.active().slice(0, 5); const prios = (w.priorities || []).map(id => Store.get('tasks', id)).filter(t => t && t.status !== 'Done');
  const items = calendarItems(ws, we); const byDate = {}; items.forEach(it => { (byDate[it.date] = byDate[it.date] || []).push(it); });
  const showGym = !hiddenModule('gym'), showFood = !hiddenModule('food');
  const workouts = showGym ? items.filter(it => it.kind === 'event' && (it.rec.type === 'Workout' || it.area === 'gym') && it.date >= today) : [];
  const plan = showFood ? (Store.get('mealPlans', 'w' + ws) || { slots: {} }) : null; const meals = plan ? D.range(today, we).map(d => ({ d, s: plan.slots[d + '|dinner'] })).filter(x => x.s) : [];
  return `<div class="card stack"><div class="row-nw between"><div><div class="eyebrow">This week</div><h2>${esc(D.fmt(ws))} – ${esc(D.fmt(we))}</h2></div><button class="btn ghost sm" type="button" data-act="nav" data-page="calendar">Calendar ${icon('chevron')}</button></div>
    <input class="input inline" id="focus_home" data-bind="weeks|w${ws}|focus" value="${esc(w.focus || '')}" placeholder="Weekly focus…" aria-label="Weekly focus">
    ${prios.length ? `<div><div class="eyebrow mb">This week's three</div><div class="list">${prios.map(t => taskRow(t)).join('')}</div></div>` : ''}
    <div class="week-strip">${D.range(ws, we).map(d => { const l = byDate[d] || []; return `<div class="wd ${d === today ? 'today' : ''}" data-act="calDayView" data-date="${d}" style="cursor:pointer"><b>${DAYS[D.dow(d)].slice(0, 3)} ${+d.slice(8)}</b>${l.slice(0, 3).map(it => `<div title="${esc(it.title)}" style="${it.kind === 'due' ? 'color:var(--danger)' : ''}">${esc(it.allDay ? it.title : D.fmtTime(it.startTime).replace(' ', '') + ' ' + it.title)}</div>`).join('')}${l.length > 3 ? `<div class="faint">+${l.length - 3}</div>` : ''}</div>`; }).join('')}</div>
    <div class="grid grid-2"><div><div class="eyebrow mb">Deadlines in 7 days</div>${deadlines.length ? `<div class="list">${deadlines.map(t => taskRow(t)).join('')}</div>` : '<p class="small muted">None due this week.</p>'}</div>
    <div><div class="eyebrow mb">Active projects</div>${projects.length ? `<div class="stack-s">${projects.map(p => { const na = Projects.nextAction(p); return `<div class="row-nw small"><span class="title grow truncate" style="font-weight:500" data-act="projectOpen" data-id="${p.id}">${esc(p.name)}</span><span class="muted truncate" style="max-width:50%">${na ? esc(na.title) : 'no next action'}</span></div>`; }).join('')}</div>` : '<p class="small muted">No active projects.</p>'}</div></div>
    ${workouts.length || meals.length ? `<div class="row small muted">${workouts.length ? `<span>${icon('activity')} ${workouts.map(x => `${D.fmt(x.date, 'dayname')} ${esc(x.title)}`).join(', ')}</span>` : ''}${meals.length ? `<span>${icon('utensils')} ${meals.map(x => `${D.fmt(x.d, 'dayname')}: ${esc(Food.slotLabel(x.s))}`).join(' · ')}</span>` : ''}</div>` : ''}</div>`;
}
function homeCapture() { const items = QuickCapture.items.filter(it => !it.module || !hiddenModule(it.module)); return `<div class="card"><div class="row-nw between mb"><div class="eyebrow">Quick capture</div></div><div class="chips">${items.map((it, i) => `<button class="chipbtn" type="button" data-act="qcOne" data-i="${QuickCapture.items.indexOf(it)}">${icon(it.icon)} ${esc(it.label)}</button>`).join('')}</div></div>`; }
function homeAreas() { const s = Settings.get(); return `<div><div class="row-nw between mb"><div class="eyebrow">Life areas</div></div><div class="area-cards">${AREAS.filter(a => !hiddenModule(a.page)).map(a => { const cover = a.page === 'hobbies' ? (Store.all('hobbies').map(hobbyCover).find(Boolean) || '') : a.page === 'writing' ? ((Store.all('inspiration').find(i => i.dataUrl) || {}).dataUrl || '') : ''; return `<button class="area-card ${cover ? 'has-cover' : ''}" type="button" data-act="nav" data-page="${a.page}" style="${cover ? `background-image:url('${esc(cover)}')` : ''}">${s.pinned.includes(a.page) ? `<span class="pin">${icon('pin')}</span>` : ''}<span class="ic" style="background:var(--t-${a.id})">${icon(a.icon)}</span><span class="nm">${esc(a.label)}</span><span class="sub">${esc(a.desc)}</span></button>`; }).join('')}</div></div>`; }
function homeGoals() { const g = Store.all('goals').filter(x => x.featured && x.status === 'Active').slice(0, 3); if (!g.length) return ''; return `<div class="card"><div class="row-nw between mb"><div class="eyebrow">Current goals</div><button class="btn ghost sm" type="button" data-act="nav" data-page="goals">${icon('chevron')}</button></div><div class="grid grid-3">${g.map(x => `<div><strong class="title" data-act="edit" data-col="goals" data-id="${x.id}">${esc(x.title)}</strong><div class="small muted">${esc(x.horizon)}${x.success ? ' · ' + esc(x.success) : ''}</div></div>`).join('')}</div></div>`; }
Object.assign(Actions, { qcOne(d) { const it = QuickCapture.items[+d.i]; if (it) it.act(); } });
registerPage({
  id: 'home', title: 'Home', icon: 'home',
  render() {
    const s = Settings.get(); const hour = +D.nowTime().slice(0, 2); const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const parts = { today: homeToday, week: homeWeek, capture: homeCapture, areas: homeAreas, goals: homeGoals };
    const order = (s.dashboard || ['today', 'week', 'capture', 'areas']).filter(k => parts[k]); if (!order.includes('goals')) order.push('goals');
    return `<div class="page-head"><div><h1>${greet}, ${esc(s.name)}.</h1><p>What matters today, what's coming, and a place to capture the rest.</p></div></div><div class="stack-l">${order.map(k => parts[k]()).join('')}</div>`;
  },
});

/* ===== boot.js ===== */
/* Boot: load local store, seed starters and labelled examples once, start the app and sync */
'use strict';

function seedData() {
  const s = Settings.get(); if (s.demoSeeded) return;
  const today = D.today(); const put = (col, rec) => { if (!Store.raw(col, rec.id)) Store.put(col, Object.assign({ updatedAt: 1, createdAt: 1 }, rec), { silent: true, keepTime: true }); };
  /* starters (editable, not examples) */
  [['photography', 'Photography', 'sessions', '', 'camera'], ['poetry', 'Poetry', 'count', 'Poems written', 'pen'], ['reading', 'Reading', 'count', 'Books finished', 'book'], ['soccer', 'Soccer', 'sessions', '', 'activity'], ['badminton', 'Badminton', 'sessions', '', 'activity'], ['travel', 'Travel', 'notes', '', 'compass']].forEach(([id, name, tracking, countLabel, ic], i) => put('hobbies', { id: 'seed-hobby-' + id, name, status: id === 'travel' ? 'Occasional' : 'Active', tracking, countLabel, icon: ic, why: '', ideas: '' }));
  [["Qur'an reading", 'daily'], ['Movement', 'daily'], ['Focused research', 'days'], ['Reading', 'daily'], ['Sleep routine', 'daily']].forEach(([name, type], i) => put('habits', { id: 'seed-habit-' + slug(name), name, schedule: { type, days: type === 'days' ? [1, 2, 3, 4, 5] : [], times: 3 }, order: i, createdDate: today }));
  [['Emergency fund'], ['Travel'], ['Education'], ['Major purchase']].forEach(([name]) => put('savings', { id: 'seed-savings-' + slug(name), name, target: null, allocated: 0, targetDate: '', note: '' }));
  ZAKAT_DEFAULTS.forEach((t, i) => put('checklist', { id: 'seed-zakat-' + i, group: 'zakat', text: t, done: false, order: i }));
  /* clearly labelled examples (removable in Settings) */
  put('tasks', { id: 'ex-task-1', demo: true, title: 'Example: look over last experiment’s results', area: 'research', status: 'Next', priority: 'Medium', plannedDate: today, effort: '30 min' });
  put('tasks', { id: 'ex-task-2', demo: true, title: 'Example: renew library card', area: 'personal', category: 'Renewal', status: 'Next', priority: 'Low', dueDate: D.add(today, 10) });
  put('projects', { id: 'ex-proj-1', demo: true, name: 'Example: thesis chapter — methods', area: 'research', kind: 'Thesis chapter', status: 'Active', outcome: 'A complete, reviewed methods chapter', nextActionId: 'ex-task-3' });
  put('tasks', { id: 'ex-task-3', demo: true, title: 'Example: outline the methods chapter', area: 'research', status: 'Next', priority: 'High', projectId: 'ex-proj-1' });
  put('notes', { id: 'ex-note-1', demo: true, title: 'Example: a post about learning to rest', type: 'Idea', area: 'writing', date: today, content: 'Notes capture anything. From a note you can create a task or a project, and the link back is kept.' });
  put('events', { id: 'ex-event-1', demo: true, title: 'Example: supervisor meeting', area: 'research', type: 'Meeting', date: D.add(today, 1), startTime: '10:00', endTime: '10:30' });
  put('transactions', { id: 'ex-tx-1', demo: true, type: 'Expense', amount: 42.18, category: 'Groceries', date: today, description: 'Example: weekly groceries' });
  put('bills', { id: 'ex-bill-1', demo: true, name: 'Example: streaming subscription', amount: 12.99, frequency: 'Monthly', nextDate: D.add(today, 12), category: 'Subscriptions', active: true, reviewDate: D.add(today, 60) });
  put('experiments', { id: 'ex-exp-1', demo: true, name: 'Example: exp-001 baseline', status: 'Done', date: D.add(today, -3), question: 'Does the baseline reproduce the reported result? (placeholder — replace with yours)', cohort: 'cohort-name-v1', model: 'baseline model', preproc: 'preproc v1', split: '5-fold CV, patient-level', metrics: 'Dice 0.00 (placeholder)', changed: 'Nothing; first run.', why: 'Establish a reference point.', happened: 'Replace with what actually happened.', interpretation: '', nextStep: 'Try the first change you have in mind.' });
  put('papers', { id: 'ex-paper-1', demo: true, title: 'Example: a paper on MS lesion segmentation', authors: 'Author et al.', year: 2024, topic: 'lesion segmentation', status: 'To read', relevance: 'High', finding: 'Replace with the paper’s main finding.' });
  put('recipes', { id: 'ex-recipe-1', demo: true, name: 'Example: chicken and rice', servings: 4, prepTime: '40 min', tags: ['High-Protein'], reliable: true, ingredients: [{ qty: 600, unit: 'g', name: 'chicken thighs', group: 'Protein' }, { qty: 2, unit: 'cup', name: 'basmati rice', group: 'Grains' }, { qty: 1, unit: '', name: 'onion', group: 'Produce' }, { qty: 2, unit: 'tbsp', name: 'olive oil', group: 'Pantry' }, { qty: 1, unit: 'tsp', name: 'cumin', group: 'Pantry' }], instructions: 'Brown the chicken, soften the onion with cumin, add rinsed rice and water, cover and cook until done.' });
  put('workoutTemplates', { id: 'ex-wt-1', demo: true, name: 'Example: full body A', type: 'Strength', exercises: [{ name: 'Squat', sets: [{ reps: 5, weight: '' }, { reps: 5, weight: '' }, { reps: 5, weight: '' }] }, { name: 'Bench press', sets: [{ reps: 8, weight: '' }, { reps: 8, weight: '' }, { reps: 8, weight: '' }] }, { name: 'Row', sets: [{ reps: 8, weight: '' }, { reps: 8, weight: '' }, { reps: 8, weight: '' }] }] });
  put('pieces', { id: 'ex-piece-1', demo: true, title: 'Example: why I keep a notebook', stage: 'Idea', theme: 'attention', q1: 'Replace with what you are trying to say.', checklist: EDIT_CHECKLIST.map(t => ({ text: t, done: false })) });
  put('goals', { id: 'ex-goal-1', demo: true, title: 'Example: submit one manuscript this year', area: 'research', horizon: 'This year', status: 'Active', why: 'Replace with your own goal and why it matters.', success: 'Manuscript submitted and acknowledged.', featured: true });
  Store.put('singles', Object.assign({ id: 'settings', updatedAt: 1, createdAt: 1 }, Store.single('settings'), { id: 'settings', demoSeeded: true }), { silent: true, keepTime: true });
}
(async function boot() {
  try { await Store.load(); } catch (e) { console.error(e); }
  try { seedData(); } catch (e) { console.error('seed', e); }
  App.init();
  SaveStatus.refresh();
  Reminders.start();
  Sync.init();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
  });
}
</script>
