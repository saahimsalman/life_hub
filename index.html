<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: fixed sidebar (desktop) / bottom nav (phone); calm editorial dashboard, one shared record system. */
:root{
  --bg:#f5f3ee; --surface:#fffefb; --surface-2:#efece5; --surface-3:#e7e3da;
  --text:#2a2a27; --muted:#6e6c65; --faint:#9c9a92; --line:#e3dfd6; --line-strong:#cfcac0;
  --accent:#6f8f73; --accent-ink:#4a6b4f; --accent-soft:#e5ede5; --accent-ring:rgba(111,143,115,.35);
  --danger:#a9564a; --danger-soft:#f3e3df; --warn:#9c7a33; --warn-soft:#f3ead6; --ok:#5f8963; --ok-soft:#e3ece3; --info:#587a95; --info-soft:#e1eaf0;
  --t-finance:#dfe8dc; --t-research:#dde5ee; --t-hobbies:#e9e0ec; --t-gym:#efe1d8; --t-food:#e8e9d4; --t-habits:#f0e9d6; --t-islam:#d9e9e6; --t-writing:#efdfe2; --t-personal:#e8e5df; --t-goals:#e3ebe0; --t-other:#e8e6e1;
  --shadow:0 1px 2px rgba(40,36,30,.05),0 6px 20px rgba(40,36,30,.05);
  --shadow-lg:0 12px 40px rgba(30,28,24,.16); --toast-accent:#a9c9ad;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --radius:14px; --radius-sm:9px; --sidebar:236px; --sidebar-min:68px;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-round:"Nunito","Instrument Sans",ui-rounded,system-ui,sans-serif;
  --font-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --c1:#30a38b; --c2:#933512; --c3:#005896; --c4:#cb7f1f; --c5:#9e51a7; --c6:#196b05; --c-other:#b5b1a7;
  --seq-1:#dfe9df; --seq-2:#b9d0bb; --seq-3:#8db292; --seq-4:#5f8963; --seq-5:#3f6145;
  --grid:#ebe7de; --axis:#cfcac0; --code-ink:#b4472f; --on-accent:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e201e; --surface:#262926; --surface-2:#2e322e; --surface-3:#363b36;
  --text:#ebe7de; --muted:#a8a49a; --faint:#7d7a72; --line:#373b37; --line-strong:#4a4f4a;
  --accent:#8db292; --accent-ink:#a9c9ad; --accent-soft:#2c3a2f; --accent-ring:rgba(141,178,146,.4);
  --danger:#d08b80; --danger-soft:#3c2b29; --warn:#d4b06a; --warn-soft:#3a3324; --ok:#8db292; --ok-soft:#2b3a2e; --info:#8fb0c8; --info-soft:#28333b;
  --t-finance:#2d3a2e; --t-research:#2c3540; --t-hobbies:#3a2f3c; --t-gym:#403129; --t-food:#363a26; --t-habits:#3d3625; --t-islam:#253b38; --t-writing:#3d2c30; --t-personal:#343330; --t-goals:#2d382c; --t-other:#333431;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5); --toast-accent:#4a6b4f;
  --c1:#26a894; --c2:#bb4f3d; --c3:#2e7fc8; --c4:#b08d13; --c5:#9e54aa; --c6:#448010; --c-other:#5d615c;
  --seq-1:#2c3a2f; --seq-2:#3d5a42; --seq-3:#5a8060; --seq-4:#7fa785; --seq-5:#a9c9ad;
  --grid:#323632; --axis:#4a4f4a; --code-ink:#e3907c; --on-accent:#18201a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e201e; --surface:#262926; --surface-2:#2e322e; --surface-3:#363b36;
  --text:#ebe7de; --muted:#a8a49a; --faint:#7d7a72; --line:#373b37; --line-strong:#4a4f4a;
  --accent:#8db292; --accent-ink:#a9c9ad; --accent-soft:#2c3a2f; --accent-ring:rgba(141,178,146,.4);
  --danger:#d08b80; --danger-soft:#3c2b29; --warn:#d4b06a; --warn-soft:#3a3324; --ok:#8db292; --ok-soft:#2b3a2e; --info:#8fb0c8; --info-soft:#28333b;
  --t-finance:#2d3a2e; --t-research:#2c3540; --t-hobbies:#3a2f3c; --t-gym:#403129; --t-food:#363a26; --t-habits:#3d3625; --t-islam:#253b38; --t-writing:#3d2c30; --t-personal:#343330; --t-goals:#2d382c; --t-other:#333431;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5); --toast-accent:#4a6b4f;
  --c1:#26a894; --c2:#bb4f3d; --c3:#2e7fc8; --c4:#b08d13; --c5:#9e54aa; --c6:#448010; --c-other:#5d615c;
  --seq-1:#2c3a2f; --seq-2:#3d5a42; --seq-3:#5a8060; --seq-4:#7fa785; --seq-5:#a9c9ad;
  --grid:#323632; --axis:#4a4f4a; --code-ink:#e3907c; --on-accent:#18201a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}h4{font-size:1rem;font-family:var(--font-body);font-weight:600}
p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
svg[aria-hidden="true"]{width:1em;height:1em;vertical-align:-.15em;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}.stack-s{display:flex;flex-direction:column;gap:6px}.stack-l{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row-nw{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}.grow{flex:1 1 auto;min-width:0}.wrap{flex-wrap:wrap}
.hidden,[hidden]{display:none!important}
.w100{width:100%}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prewrap{white-space:pre-wrap;word-break:break-word}
.mt{margin-top:12px}.mb{margin-bottom:12px}.mt-l{margin-top:24px}

/* ---------- shell ---------- */
.app{min-height:100vh}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20;transition:width .2s ease;overflow:hidden auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-family:var(--font-display);font-size:1.25rem;font-weight:500;white-space:nowrap}
.sidebar .brand .mark{width:28px;height:28px;border-radius:9px;background:var(--accent);flex:0 0 auto;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:1rem}
.nav-group{margin-top:10px}
.nav-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 12px 4px;font-weight:600;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border:0;background:none;width:100%;text-align:left;cursor:pointer;font-size:.93rem;min-height:38px}
.nav-item svg{width:18px;height:18px;flex:0 0 auto}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidebar.collapsed{width:var(--sidebar-min)}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .brand span,.sidebar.collapsed .nav-label,.sidebar.collapsed .sidebar-foot .segmented,.sidebar.collapsed .sidebar-foot .status-line{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0}
.main{margin-left:var(--sidebar);min-height:100vh;transition:margin .2s ease;display:flex;flex-direction:column}
.main.wide{margin-left:var(--sidebar-min)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:56px}
.topbar .title{font-family:var(--font-display);font-size:1.2rem;font-weight:500}
.status-line{font-size:.75rem;color:var(--faint);display:flex;align-items:center;gap:6px}
.status-line .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status-line.ok .dot{background:var(--ok)}.status-line.busy .dot{background:var(--warn)}.status-line.err .dot{background:var(--danger)}
.content{padding:22px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));max-width:1180px;width:100%;margin:0 auto}
@media (min-width:841px){.content{padding-bottom:48px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{color:var(--muted);max-width:60ch}
.bottomnav{display:none}
@media (max-width:840px){
  .sidebar{display:none}
  .main{margin-left:0!important}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.68rem;font-weight:500;min-height:48px;cursor:pointer}
  .bottomnav button svg{width:21px;height:21px}
  .bottomnav button[aria-current="page"]{color:var(--accent-ink)}
  .bottomnav button.capture svg{width:24px;height:24px}
  .topbar .title{font-size:1.05rem}
  .topbar .status-line span:last-child{display:none}
  h1{font-size:1.6rem}
}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:12px 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:1.2rem}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;min-width:0}
.tile .v{font-family:var(--font-display);font-size:1.5rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:10px 0}
.subtle{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px}
.notice{border-radius:var(--radius-sm);padding:10px 14px;font-size:.88rem;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--text)}
.notice.info{background:var(--info-soft);border-color:transparent;color:var(--text)}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--text)}
.notice.danger{background:var(--danger-soft);border-color:transparent;color:var(--text)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;min-height:38px;white-space:nowrap;transition:background .12s,transform .08s,border-color .12s}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.82rem;border-radius:8px}
.btn.icon{padding:0;width:36px;min-width:36px;height:36px;min-height:36px;border-radius:10px}
.btn.icon.sm{width:30px;min-width:30px;height:30px;min-height:30px}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);min-height:40px}
.textarea{min-height:90px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent-ring);outline-offset:0;border-color:var(--accent)}
.input.sm,.select.sm{min-height:32px;padding:4px 9px;font-size:.86rem;border-radius:8px}
.input.inline{border-color:transparent;background:transparent;padding-left:6px;padding-right:6px}
.input.inline:hover{background:var(--surface-2)}
.input.inline:focus{background:var(--surface)}
.input.display{font-family:var(--font-display);font-size:1.25rem;font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .help{font-size:.76rem;color:var(--faint)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form-grid .span{grid-column:1/-1}
.more-details{margin-top:4px}
.more-details>summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:.88rem;list-style:none;display:inline-flex;align-items:center;gap:6px}
.more-details>summary::-webkit-details-marker{display:none}
.more-details[open]>summary{margin-bottom:10px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;font-size:.9rem;min-height:30px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.segmented button{border:0;background:transparent;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:.84rem;font-weight:500;min-height:30px}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.84rem;font-weight:500;color:var(--muted);min-height:32px}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn .n{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.pill.area{color:var(--text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.due{background:var(--danger-soft);color:var(--danger)}
.pill.planned{background:var(--accent-soft);color:var(--accent-ink)}
.pill svg,.chipbtn svg{width:12px;height:12px}
.item .title svg.inl{width:14px;height:14px;vertical-align:-2px;color:var(--warn)}
.prio{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.prio.High{background:var(--danger)}.prio.Medium{background:var(--warn)}.prio.Low{background:var(--faint)}
.progress{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.progress.warn>i{background:var(--warn)}.progress.danger>i{background:var(--danger)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);min-height:44px}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:500;cursor:pointer;line-height:1.35;word-break:break-word}
.item .title:hover{color:var(--accent-ink)}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:.78rem;color:var(--muted)}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.item.dragging{opacity:.4}
.cb{appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);margin:2px 0 0;cursor:pointer;flex:0 0 auto;position:relative;background:var(--surface);transition:background .12s,border-color .12s}
.cb:hover{border-color:var(--accent)}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb.sq{border-radius:6px}
.handle{color:var(--faint);cursor:grab;display:flex;align-items:center;padding:4px 0}
.handle svg{width:14px;height:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.table{width:100%;border-collapse:collapse;font-size:.9rem}
table.table th,table.table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.table th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.table tr:last-child td{border-bottom:0}
table.table td.r,table.table th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:28px;height:28px;color:var(--faint)}
.empty p{max-width:36ch}
.quickadd{display:flex;gap:8px;align-items:center}
.quickadd .input{flex:1}

/* ---------- area cards ---------- */
.area-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.area-card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--text);cursor:pointer;text-align:left;min-height:96px;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.area-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.area-card .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.area-card .ic svg{width:18px;height:18px}
.area-card .nm{font-weight:600;font-size:.92rem}
.area-card .sub{font-size:.76rem;color:var(--muted)}
.area-card.has-cover{background-size:cover;background-position:center;color:#fff;justify-content:flex-end;min-height:120px}
.area-card.has-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,18,.7),rgba(20,20,18,.05));}
.area-card.has-cover>*{position:relative}
.area-card.has-cover .sub{color:rgba(255,255,255,.8)}
.area-card .pin{position:absolute;top:8px;right:8px;color:var(--accent-ink)}
.area-card .pin svg{width:14px;height:14px}

/* ---------- modal / sheet / menu / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(25,24,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));animation:fade .15s ease}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:min(90vh,calc(100vh - 32px));display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:rise .18s ease;border:1px solid var(--line)}
.modal.wide{max-width:980px}
.modal.narrow{max-width:420px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px 10px}
.modal-head h3{flex:1;font-size:1.3rem}
.modal-body{padding:6px 20px 18px;overflow:auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .left{margin-right:auto;display:flex;gap:8px}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;max-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;animation:fade .12s ease}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:.9rem;min-height:36px}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu button svg{width:15px;height:15px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
@media (min-width:841px){.toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);font-size:.9rem;animation:rise .18s ease;max-width:100%}
.toast button{border:0;background:none;color:var(--toast-accent);font-weight:600;cursor:pointer;padding:4px 6px}
.search-box{position:fixed;inset:0;z-index:55;background:rgba(25,24,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:min(12vh,80px) max(16px,env(safe-area-inset-left,0px)) 0}
.search-panel{background:var(--surface);border-radius:16px;width:100%;max-width:620px;box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden;max-height:70vh;display:flex;flex-direction:column}
.search-panel .input{border:0;border-radius:0;padding:14px 18px;font-size:1.05rem;border-bottom:1px solid var(--line);min-height:52px}
.search-panel .input:focus{outline:none}
.search-results{overflow:auto}
.search-results button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 18px;cursor:pointer;text-align:left;min-height:44px}
.search-results button:hover,.search-results button:focus-visible{background:var(--surface-2)}
.search-results .k{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;min-width:70px}

/* ---------- kanban / dnd ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;min-height:160px;display:flex;flex-direction:column;gap:8px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h4{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.kcard .t{font-weight:500}
.kcard .m{font-size:.76rem;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dropzone.over{background:var(--accent-soft)}

/* ---------- calendar ---------- */
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-cell.other{opacity:.55}
.cal-cell.today{border-color:var(--accent)}
.cal-cell .d{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.cal-cell.today .d{color:var(--accent-ink)}
.evchip{font-size:.72rem;padding:2px 6px;border-radius:6px;background:var(--surface-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--accent);min-width:0}
.evchip.task{border-left-color:var(--info)}
.evchip.due{border-left-color:var(--danger)}
.evchip.done{opacity:.55;text-decoration:line-through}
.cal-more{font-size:.72rem;color:var(--muted);padding-left:4px}
.cal-week{display:grid;grid-template-columns:52px repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal-week.day{grid-template-columns:52px 1fr}
.cal-week .hdr{padding:8px 6px;border-bottom:1px solid var(--line);font-size:.78rem;text-align:center;color:var(--muted);font-weight:600;min-width:0}
.cal-week .hdr.today{color:var(--accent-ink)}
.cal-week .allday{min-height:34px;border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.cal-week .timecol{font-size:.68rem;color:var(--faint);position:relative;border-right:1px solid var(--line)}
.cal-week .daycol{position:relative;border-right:1px solid var(--line);min-width:0}
.cal-week .daycol:last-child,.cal-week .allday:last-child{border-right:0}
.cal-week .hour{height:44px;border-bottom:1px solid var(--line);box-sizing:border-box}
.cal-week .timecol .hour{padding:2px 4px;text-align:right}
.cal-week .evblock{position:absolute;left:2px;right:2px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:3px 6px;font-size:.72rem;overflow:hidden;cursor:pointer;line-height:1.25;min-width:0}
.cal-week .evblock.task{background:var(--info-soft);border-left-color:var(--info)}
.cal-week .evblock.due{background:var(--danger-soft);border-left-color:var(--danger)}
.cal-scroll{max-height:62vh;overflow:auto}
.agenda-day{padding:8px 0;border-bottom:1px solid var(--line)}
.agenda-day h4{margin-bottom:6px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-strip .wd{background:var(--surface-2);border-radius:10px;padding:8px 6px;min-height:72px;min-width:0;font-size:.74rem}
.week-strip .wd.today{outline:2px solid var(--accent)}
.week-strip .wd b{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}
.week-strip .wd div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- habits ---------- */
.habit-grid{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(7,1fr);gap:4px;align-items:center;font-size:.8rem}
.habit-grid .hc{display:flex;justify-content:center}
.hstate{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:.7rem;color:var(--faint)}
.hstate.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hstate.missed{background:var(--surface-3);color:var(--muted)}
.hstate.off{background:transparent;border-style:dashed;opacity:.5}
.tri{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.tri button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.82rem;font-weight:500;min-height:34px;min-width:44px}
.tri button+button{border-left:1px solid var(--line)}
.tri button[aria-pressed="true"].yes{background:var(--accent);color:#fff}
.tri button[aria-pressed="true"].no{background:var(--surface-3);color:var(--text)}
.scale{display:flex;gap:6px}
.scale button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:36px;cursor:pointer;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- hobbies / media ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.hobby-card{border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s;text-align:left;padding:0}
.hobby-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hobby-card .cover{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--faint)}
.hobby-card .cover svg{width:28px;height:28px}
.hobby-card .cb-body{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.media-item{border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);position:relative}
.media-item img{aspect-ratio:1;object-fit:cover;width:100%}
.media-item .cap{font-size:.76rem;padding:6px 8px;color:var(--muted)}
.media-item .txt{padding:12px;font-family:var(--font-display);font-size:.95rem;white-space:pre-wrap;min-height:100px}
.media-item .x{position:absolute;top:4px;right:4px}

/* ---------- gym ---------- */
.setrow{display:grid;grid-template-columns:36px 1fr 1fr 32px;gap:6px;align-items:center}
.setrow .input{text-align:center}
.exercise{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.spark{width:100%;height:48px}

/* ---------- food ---------- */
.planner{display:grid;grid-template-columns:90px repeat(7,minmax(120px,1fr));gap:6px;min-width:900px}
.planner .ph{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:4px;text-align:center}
.planner .ph.today{color:var(--accent-ink)}
.planner .pl{font-size:.78rem;color:var(--muted);font-weight:600;padding:8px 4px}
.mealcell{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;min-height:58px;padding:6px 8px;font-size:.8rem;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mealcell.filled{border-style:solid;background:var(--surface)}
.mealcell.over{background:var(--accent-soft)}
.mealcell .mt{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.mealcell .ms{color:var(--muted);font-size:.72rem}

/* ---------- writing ---------- */
.editor-overlay{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.editor-bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.editor-wrap{flex:1;overflow:auto;padding:30px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.editor-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.editor-inner .ttl{font-family:var(--font-display);font-size:2rem;border:0;background:transparent;width:100%;padding:4px 0}
.editor-inner .ttl:focus{outline:none}
.editor-inner .body{font-family:var(--font-display);font-size:1.15rem;line-height:1.7;border:0;background:transparent;width:100%;min-height:60vh;resize:none;padding:0}
.editor-inner .body:focus{outline:none}

/* ---------- misc ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.guide h3{margin-top:22px;margin-bottom:6px}
.guide ol,.guide ul{padding-left:20px;margin:6px 0}
.guide li{margin:3px 0}
kbd{font-family:var(--font-body);font-size:.76rem;background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.cover-strip{height:120px;border-radius:12px;background:var(--surface-2);background-size:cover;background-position:center;margin-bottom:14px}
.linklist a{word-break:break-all}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:18;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:var(--shadow-lg);display:grid;place-items:center;cursor:pointer}
.fab svg{width:22px;height:22px}
@media (max-width:840px){.fab{display:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- block editor ---------- */
.be{--be-font:var(--font-body);font-family:var(--be-font);font-size:1rem;line-height:1.65;color:var(--text);position:relative;padding:2px 0 8px;word-break:break-word}
.be[data-font="serif"]{--be-font:var(--font-display);font-size:1.1rem}
.be[data-font="mono"]{--be-font:var(--font-mono);font-size:.92rem}
.be[data-font="round"]{--be-font:var(--font-round)}
.be[data-font="hand"]{--be-font:var(--font-hand);font-size:1.3rem;line-height:1.45}
.blk{position:relative;display:flex;align-items:flex-start;padding-left:calc(var(--ind,0) * 26px);border-radius:6px}
.blk.hidden-child{display:none}
.blk-gutter{position:absolute;top:3px;left:calc(var(--ind,0) * 26px - 48px);display:flex;opacity:0;transition:opacity .12s}
@media (hover:hover) and (pointer:fine){.blk:hover>.blk-gutter{opacity:1}}
@media (hover:none),(pointer:coarse){.blk-gutter{display:none}}
.blk-gutter button{border:0;background:none;color:var(--faint);width:23px;height:24px;border-radius:5px;cursor:pointer;display:grid;place-items:center;padding:0}
.blk-gutter button:hover{background:var(--surface-2);color:var(--muted)}
.blk-gutter svg{width:15px;height:15px}
.blk-grip{cursor:grab}
.blk.dragging{opacity:.35}
.blk-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:4px}
.blk-text{flex:1;min-width:0;outline:none;padding:3px 2px;white-space:pre-wrap;min-height:calc(1.65em + 6px);caret-color:var(--accent-ink)}
.blk-text.is-empty::before{content:attr(data-ph);float:left;height:0;color:var(--faint);pointer-events:none;white-space:normal;max-width:100%}
.blk-p .blk-text.is-empty:not(:focus)::before{content:none}
.be.doc-empty .blk-p .blk-text.is-empty::before{content:attr(data-ph)}
.be-static .blk-text.is-empty::before{content:none}
.blk-h1 .blk-text{font-size:1.72em;font-weight:650;line-height:1.25;padding-top:.55em}
.blk-h2 .blk-text{font-size:1.38em;font-weight:650;line-height:1.3;padding-top:.45em}
.blk-h3 .blk-text{font-size:1.14em;font-weight:650;line-height:1.35;padding-top:.3em}
.be[data-font="serif"] .blk-h1 .blk-text,.be[data-font="serif"] .blk-h2 .blk-text{font-weight:550}
.blk-mk{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:24px;height:calc(1.65em + 6px);color:var(--text)}
.be[data-font="hand"] .blk-mk{height:calc(1.45em + 6px)}
.blk-bullet i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.blk-num{font-variant-numeric:tabular-nums;justify-content:flex-end;padding-right:3px;min-width:26px}
.blk-check{appearance:none;width:17px;height:17px;border-radius:4px;border:1.6px solid var(--line-strong);background:var(--surface);cursor:pointer;margin:0;position:relative;transition:background .12s,border-color .12s}
.blk-check:hover{border-color:var(--accent)}
.blk-check:checked{background:var(--accent);border-color:var(--accent)}
.blk-check:checked::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.blk.checked .blk-text{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.blk-tog{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);border-radius:5px}
.blk-tog:hover{background:var(--surface-2)}
.blk-tog svg{width:16px;height:16px;transition:transform .15s}
.blk.open>.blk-main>.blk-tog svg{transform:rotate(90deg)}
.blk-quote .blk-text{border-left:3px solid var(--text);padding-left:14px;margin:4px 0;font-size:1.04em}
.blk-callout .blk-main{background:var(--surface-2);border-radius:10px;padding:10px 12px 10px 8px;margin:4px 0}
.blk-callout .blk-ci{color:var(--accent-ink)}
.blk-callout .blk-ci svg{width:18px;height:18px}
.blk-code .blk-text{font-family:var(--font-mono);font-size:.86em;line-height:1.6;background:var(--surface-2);border-radius:9px;padding:12px 14px;margin:4px 0;tab-size:2;white-space:pre-wrap;color:var(--text)}
.blk-code .blk-text.is-empty::before{content:attr(data-ph)}
.blk-text code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);color:var(--code-ink);padding:1px 5px;border-radius:5px}
.blk-text a{color:var(--accent-ink);text-decoration:underline;text-decoration-color:var(--accent-ring);text-underline-offset:3px;cursor:pointer}
.blk-hr{flex:1;height:22px;display:flex;align-items:center;cursor:pointer;outline:none;border-radius:4px}
.blk-hr::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.blk-fig{flex:1;margin:6px 0;outline:none;border-radius:10px}
.blk-fig img{border-radius:10px;max-height:520px;width:auto;max-width:100%;object-fit:contain}
.blk-cap{font-size:.86rem;color:var(--muted);padding:4px 2px;outline:none;min-height:1.6em}

.rv-ov.full{padding:0;background:var(--bg);animation:none}

'use strict';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const clone = o => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const CAD = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const money = n => CAD.format(Number(n) || 0);
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`;

/* ---------------- dates (YYYY-MM-DD strings, timezone-aware "today") ---------------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const D = {
  tz() { return (Store.ready && Settings.get().tz) || 'America/Edmonton'; },
  parts(date = new Date()) {
    try {
      const f = new Intl.DateTimeFormat('en-CA', { timeZone: D.tz(), year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      const o = {}; f.formatToParts(date).forEach(p => { o[p.type] = p.value; });
      return { date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour === '24' ? '00' : o.hour}:${o.minute}` };
    } catch (e) { return { date: D.fromDate(date), time: `${pad(date.getHours())}:${pad(date.getMinutes())}` }; }
  },
  today() { return D.parts().date; },
  nowTime() { return D.parts().time; },
  fromDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
  valid(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  utcStr(t) { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; },
  add(s, n) { return D.utcStr(D.parse(s) + n * 86400000); },
  diff(a, b) { return Math.round((D.parse(a) - D.parse(b)) / 86400000); },
  dow(s) { return new Date(D.parse(s)).getUTCDay(); },
  weekStart(s) { const d = (D.dow(s) + 6) % 7; return D.add(s, -d); },
  weekKey(s) { return 'w' + D.weekStart(s); },
  monthKey(s) { return s.slice(0, 7); },
  monthStart(k) { return k + '-01'; },
  monthEnd(k) { const [y, m] = k.split('-').map(Number); return D.utcStr(Date.UTC(y, m, 0)); },
  addMonths(k, n) { const [y, m] = k.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}`; },
  monthLabel(k) { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; },
  fmt(s, style = 'short') {
    if (!D.valid(s)) return '';
    const d = new Date(D.parse(s)); const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate(), wd = d.getUTCDay();
    const thisYear = D.today().slice(0, 4) === String(y);
    if (style === 'short') return `${MONTHS[m].slice(0, 3)} ${day}${thisYear ? '' : ', ' + y}`;
    if (style === 'long') return `${DAYS[wd].slice(0, 3)}, ${MONTHS[m].slice(0, 3)} ${day}${thisYear ? '' : ', ' + y}`;
    if (style === 'full') return `${DAYS[wd]}, ${MONTHS[m]} ${day}, ${y}`;
    if (style === 'dayname') return DAYS[wd].slice(0, 3);
    return s;
  },
  rel(s) { if (!D.valid(s)) return ''; const t = D.today(); const diff = D.diff(s, t); if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday'; return D.fmt(s, 'short'); },
  fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const hh = h % 12 || 12; return `${hh}:${pad(m)} ${ap}`; },
  mins(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; },
  toTime(mins) { mins = ((mins % 1440) + 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; },
  range(a, b) { const out = []; let s = a; while (s <= b) { out.push(s); s = D.add(s, 1); } return out; },
};

/* ---------------- IndexedDB (local persistence) ---------------- */
const IDB = (() => {
  let dbp = null, broken = false;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('saahim-life-hub', 1);
        r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'key' }); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
    dbp.catch(() => { broken = true; });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const s = t.objectStore(store); const req = fn(s);
      t.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get broken() { return broken; },
    getAll: () => tx('records', 'readonly', s => s.getAll()),
    put: rec => tx('records', 'readwrite', s => s.put(rec)),
    del: key => tx('records', 'readwrite', s => s.delete(key)),
    clear: () => tx('records', 'readwrite', s => s.clear()),
    metaGet: async key => { const r = await tx('meta', 'readonly', s => s.get(key)); return r ? r.value : undefined; },
    metaPut: (key, value) => tx('meta', 'readwrite', s => s.put({ key, value })),
  };
})();

/* ---------------- Store: in-memory records, local persistence, change tracking ---------------- */
const Store = {
  data: {}, dirty: new Set(), ready: false, local: 'unknown', listeners: [],
  col(c) { if (!this.data[c]) this.data[c] = new Map(); return this.data[c]; },
  all(c, opts = {}) { const out = []; this.col(c).forEach(r => { if (!r.deleted || opts.deleted) out.push(r); }); return out; },
  get(c, id) { const r = this.col(c).get(id); return r && !r.deleted ? r : null; },
  raw(c, id) { return this.col(c).get(id) || null; },
  key(c, id) { return c + '/' + id; },
  async load() {
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('storage timeout')), ms));
    try {
      const rows = await Promise.race([IDB.getAll(), timeout(4000)]);
      rows.forEach(row => { const r = row.rec; if (r && r.col && r.id) this.col(r.col).set(r.id, r); });
      const dirty = await Promise.race([IDB.metaGet('dirty'), timeout(2000)]); if (Array.isArray(dirty)) dirty.forEach(k => this.dirty.add(k));
      this.local = 'ok';
    } catch (e) {
      console.warn('IndexedDB unavailable, falling back to localStorage', e);
      try { const raw = localStorage.getItem('hub.records'); if (raw) JSON.parse(raw).forEach(r => { if (r && r.col && r.id) this.col(r.col).set(r.id, r); }); const d = localStorage.getItem('hub.dirty'); if (d) JSON.parse(d).forEach(k => this.dirty.add(k)); localStorage.setItem('hub.probe', '1'); this.local = 'ls'; }
      catch (e2) { console.warn('No persistent storage', e2); this.local = 'none'; }
    }
    this.ready = true;
  },
  _lsTimer: null,
  _persist(rec) {
    if (this.local === 'ok') {
      IDB.put({ key: this.key(rec.col, rec.id), rec }).catch(e => { console.warn(e); this.local = 'error'; SaveStatus.refresh(); });
      IDB.metaPut('dirty', Array.from(this.dirty)).catch(() => {});
    } else if (this.local === 'ls') {
      clearTimeout(this._lsTimer);
      this._lsTimer = setTimeout(() => { try { const all = []; Object.keys(this.data).forEach(c => this.data[c].forEach(r => all.push(r))); localStorage.setItem('hub.records', JSON.stringify(all)); localStorage.setItem('hub.dirty', JSON.stringify(Array.from(this.dirty))); } catch (e) { console.warn(e); this.local = 'error'; SaveStatus.refresh(); } }, 300);
    }
  },
  put(c, rec, opts = {}) {
    rec = Object.assign({}, rec); rec.col = c; rec.id = rec.id || uid();
    if (!rec.createdAt) rec.createdAt = Date.now();
    rec.updatedAt = opts.keepTime && rec.updatedAt ? rec.updatedAt : Date.now();
    delete rec.deleted;
    this.col(c).set(rec.id, rec);
    this.dirty.add(this.key(c, rec.id)); this._persist(rec);
    if (!opts.silent) { Sync.schedule(); SaveStatus.saving(); bump(); }
    this.listeners.forEach(fn => { try { fn(c, rec); } catch (e) {} });
    return rec;
  },
  patch(c, id, fields, opts) { const r = this.raw(c, id); if (!r) return null; return this.put(c, Object.assign({}, r, fields), opts); },
  remove(c, id, opts = {}) {
    const r = this.raw(c, id); if (!r) return null;
    const dead = Object.assign({}, r, { deleted: true, updatedAt: Date.now() });
    this.col(c).set(id, dead); this.dirty.add(this.key(c, id)); this._persist(dead);
    if (!opts.silent) { Sync.schedule(); SaveStatus.saving(); bump(); }
    this.listeners.forEach(fn => { try { fn(c, dead); } catch (e) {} });
    return r;
  },
  applyRemote(rec) {
    if (!rec || !rec.col || !rec.id) return;
    this.col(rec.col).set(rec.id, rec);
    this.dirty.delete(this.key(rec.col, rec.id));
    this._persist(rec);
  },
  async wipe() { this.data = {}; this.dirty.clear(); try { await IDB.clear(); await IDB.metaPut('dirty', []); } catch (e) {} try { localStorage.removeItem('hub.records'); localStorage.removeItem('hub.dirty'); } catch (e) {} },
  single(name) { return this.get('singles', name) || { col: 'singles', id: name }; },
  setSingle(name, fields, opts) { const cur = this.single(name); return this.put('singles', Object.assign({}, cur, fields, { id: name }), opts); },
};

const Settings = {
  cache: null,
  defaults() { return { name: 'Saahim', tz: 'America/Edmonton', theme: 'system', hidden: [], pinned: [], dashboard: ['today', 'week', 'capture', 'areas'], categories: null, salahTracking: false, demoSeeded: false, writingFont: 'sans', gymUnit: 'kg', extCals: [], calFeed: null }; },

/* ---------------- Sync: private per-user cloud store (claude.ai db capability) ---------------- */
const Sync = {
  backend: null, coll: null, status: 'off', detail: '', pushing: false, timer: null, unsub: null, started: false,
  standalone() { return !(window.claude && window.claude.use); },
  async init() {
    if (this.standalone()) { if (typeof Supa !== 'undefined' && Supa.signedIn()) { this.backend = 'supa'; return Supa.start(); } this.backend = null; this.status = 'off'; this.detail = 'Your data is saved in this browser on this device only. Turn on Cloud sync in Settings to see the same data on every device.'; SaveStatus.refresh(); return; }
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) { this.status = 'off'; this.detail = 'Saved on this device only. Open this page signed in to claude.ai (as a Contributor or above) to sync across devices.'; SaveStatus.refresh(); return; }
      const id = await user.id();
      if (!id) { this.status = 'off'; this.detail = 'Saved on this device only: no private cloud storage for this visit (not signed in).'; SaveStatus.refresh(); return; }
      this.coll = db.doc('data/users/' + id + '/hub').collection('records');
      this.status = 'syncing'; SaveStatus.refresh();
      await this.pull();
      this.subscribe();
      this.started = true;
      await this.push();
      this.status = this.dirty() ? 'error' : 'synced'; SaveStatus.refresh();
    } catch (e) { console.warn('sync init', e); this.status = 'error'; this.detail = e && e.message ? e.message : 'Could not reach the cloud store.'; SaveStatus.refresh(); }
  },
  dirty() { return Store.dirty.size > 0; },
  async pull() {
    const snap = await this.coll.get();
    let applied = 0;
    snap.docs.forEach(d => {
      const r = d.data(); if (!r || !r.col || !r.id) return;
      const local = Store.raw(r.col, r.id);
      const key = Store.key(r.col, r.id);
      if (!local) { Store.applyRemote(r); applied++; return; }
      if ((r.updatedAt || 0) > (local.updatedAt || 0)) { Store.applyRemote(r); applied++; }
      else if ((r.updatedAt || 0) === (local.updatedAt || 0)) Store.dirty.delete(key);
    });
    if (applied) bump();
  },
  subscribe() {
    try {
      const since = Date.now() - 60000;
      this.unsub = this.coll.where('updatedAt', '>', since).onSnapshot(snap => {
        let changed = 0;
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') return;
          const r = ch.doc.data(); if (!r || !r.col) return;
          const local = Store.raw(r.col, r.id);
          if (!local || (r.updatedAt || 0) > (local.updatedAt || 0)) { Store.applyRemote(r); changed++; }
        });
        if (changed) { bump(); toast('Updated from another device'); }
      }, err => { console.warn('sync listener', err); });
    } catch (e) { console.warn(e); }
  },
  schedule() { if (this.backend === 'supa') return Supa.schedule(); if (!this.coll) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.coll || this.pushing) return;
    this.pushing = true; this.status = 'syncing'; SaveStatus.refresh();
    try {
      for (const key of Array.from(Store.dirty)) {
        const i = key.indexOf('/'); const c = key.slice(0, i), id = key.slice(i + 1);
        const rec = Store.raw(c, id); if (!rec) { Store.dirty.delete(key); continue; }
        const docId = (c + '__' + id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');
        await this.coll.doc(docId).set(rec);
        Store.dirty.delete(key);
      }
      await IDB.metaPut('dirty', Array.from(Store.dirty)).catch(() => {});
      this.status = 'synced'; this.detail = '';
    } catch (e) {
      console.warn('push', e); this.status = 'error';
      this.detail = (e && e.code === 'quota_exceeded') ? 'Cloud storage is full. Remove large photos or old records.' : (e && e.message) || 'Sync failed; changes are kept on this device and retried later.';
      setTimeout(() => this.schedule(), 20000);
    }
    this.pushing = false; SaveStatus.refresh();
    if (Store.dirty.size && this.status === 'synced') this.schedule();
  },
};

/* ---------------- save status ---------------- */
const SaveStatus = {
  el: null, t: null,
  saving() { clearTimeout(this.t); this.render('busy', 'Saving…'); this.t = setTimeout(() => this.refresh(), 700); },
  refresh() {
    if (Store.local === 'none' || Store.local === 'error') return this.render('err', 'Not saved: storage blocked in this browser');
    if (Sync.status === 'synced') return this.render('ok', 'Saved & synced to your private store');
    if (Sync.status === 'syncing') return this.render('busy', 'Syncing…');
    if (Sync.status === 'error') return this.render('err', 'Saved on this device · sync paused');
    if (Store.local === 'ls') return this.render('ok', 'Saved in this browser (limited storage)');
    return this.render('ok', Sync.standalone() ? 'Saved in this browser' : 'Saved on this device only');
  },
  render(kind, text) { $$('.status-line').forEach(el => { el.className = 'status-line ' + kind; el.innerHTML = `<span class="dot"></span><span>${esc(text)}</span>`; el.title = Sync.detail || text; }); },
};

/* ---------------- undo & toasts ---------------- */
function toast(msg, opts = {}) {
  const wrap = $('#toasts'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button type="button">Undo</button>' : ''}`;
  if (opts.undo) el.querySelector('button').onclick = () => { opts.undo(); el.remove(); toast('Undone'); };
  wrap.appendChild(el); setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, opts.ms || (opts.undo ? 7000 : 2600));
}
function withUndo(label, doIt, revert) { doIt(); toast(label, { undo: revert }); }

/* ---------------- media (images as compressed data URLs) ---------------- */
function readImageFile(file, maxPx = 1000) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Choose an image file'));
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height; const s = Math.min(1, maxPx / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 190000 && q > 0.35) { q -= 0.12; out = c.toDataURL('image/jpeg', q); }
      if (out.length > 200000) return rej(new Error('Image is too large even after shrinking; try a smaller one.'));
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
    img.src = url;
  });
}
function pickImage(onReady, maxPx) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { const d = await readImageFile(f, maxPx); onReady(d); } catch (e) { toast(e.message); } };
  inp.click();
}

    bars(spec, opts) { return figure('bars', spec, opts); },

  KEY: 'hub.supa', SINCE: 'hub.supa.since',

  async authCall(c, path, body) {

  async token(force) {

  async push() {

  saveDirty() { if (Store.local === 'ok') IDB.metaPut('dirty', Array.from(Store.dirty)).catch(() => {}); else if (Store.local === 'ls') try { localStorage.setItem('hub.dirty', JSON.stringify(Array.from(Store.dirty))); } catch (e) {} },
  async sync(opts = {}) {

};

function taskViewItems(view) {
  const today = D.today(), tomorrow = D.add(today, 1), ws = D.weekStart(today), we = D.add(ws, 6);
  switch (view) {
    case 'inbox': return Tasks.open().filter(t => t.status === 'Inbox');
    case 'today': return Tasks.todayList(today);
    case 'tomorrow': return Tasks.forDate(tomorrow).filter(t => !Tasks.isDoneOn(t, tomorrow));
    case 'week': { const out = []; D.range(ws, we).forEach(d => Tasks.forDate(d).forEach(t => { if (!out.find(x => (x.baseId || x.id) === (t.baseId || t.id) && x.occDate === t.occDate) && !Tasks.isDoneOn(t, d)) out.push(Object.assign({}, t, { occDate: d })); })); return out.sort((a, b) => (a.occDate || a.plannedDate || a.dueDate) > (b.occDate || b.plannedDate || b.dueDate) ? 1 : -1); }
    case 'deadlines': return Tasks.deadlines(today, D.add(today, 365));
    case 'overdue': return Tasks.overdue(today);
    case 'unscheduled': return Tasks.open().filter(t => !t.plannedDate && !t.dueDate && t.status !== 'Waiting' && t.status !== 'Inbox');
    case 'waiting': return Tasks.open().filter(t => t.status === 'Waiting');
    case 'area': return Tasks.open();
    case 'completed': return Tasks.all().filter(t => t.status === 'Done').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
    case 'archived': return Store.all('tasks').filter(t => t.archived);
  }
  return [];
}

const Reminders = {
  timer: null,
  support() { if (!('Notification' in window)) return { ok: false, label: 'Not available in this browser or frame', cls: 'warn' }; const p = Notification.permission; if (p === 'granted') return { ok: true, label: 'Allowed in this browser', cls: 'ok' }; if (p === 'denied') return { ok: false, label: 'Blocked by the browser', cls: 'danger' }; return { ok: false, label: 'Permission not asked yet', cls: '' }; },
  start() { clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 30000); this.tick(); },
  tick() {
    if (!Store.ready) return;
    const today = D.today(); const items = calendarItems(D.add(today, -1), D.add(today, 2)).filter(it => it.reminder != null && !it.done);
    const now = Date.now();
    items.forEach(it => {
      const at = this.fireTime(it); if (!at) return;
      const key = it.occKey || it.date; const st = (it.rec.reminderState || {}); if (st.firedKey === key) return;
      if (now >= at && now - at < 3 * 60000) this.fire(it, key);
      else if (now - at >= 3 * 60000) Store.patch(it.rec.col, it.baseId, { reminderState: { status: 'missed', firedKey: key, at: now } }, { silent: true });
    });
  },
  fireTime(it) { const t = it.allDay || !it.startTime ? '09:00' : it.startTime; const [y, m, d] = it.date.split('-').map(Number); const [hh, mm] = t.split(':').map(Number); const local = new Date(y, m - 1, d, hh, mm).getTime(); return local - it.reminder * 60000; },
  fire(it, key) {
    const body = `${it.allDay ? 'Today' : D.fmtTime(it.startTime)} · ${areaLabel(it.area)}`; let status = 'delivered';
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification(it.title, { body, tag: it.baseId + key }); else status = 'failed'; } catch (e) { status = 'failed'; }
    toast(`Reminder: ${it.title} (${body})`, { ms: 12000 });
    Store.patch(it.rec.col, it.baseId, { reminderState: { status, firedKey: key, at: Date.now() } }, { silent: true });
  },
  async request() { if (!('Notification' in window)) { toast('Notifications are not available here'); return; } try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Notifications allowed' : 'Notifications not allowed'); } catch (e) { toast('Could not request permission in this frame'); } bump(); },
  test() { try { if ('Notification' in window && Notification.permission === 'granted') { new Notification("Saahim's Life Hub", { body: 'Test notification — reminders will look like this while the page is open.' }); toast('Test notification sent'); } else toast('Browser notifications are not allowed here; reminders will show as in-app toasts only.'); } catch (e) { toast('Notification failed: ' + e.message); } },
};

/* ---------- export: Google Calendar link & ICS ---------- */
function gcalLink(it) {
  const tz = D.tz(); const d = it.date.replace(/-/g, '');
  const dates = it.allDay || !it.startTime ? `${d}/${D.add(it.date, 1).replace(/-/g, '')}` : `${d}T${it.startTime.replace(':', '')}00/${d}T${(it.endTime || D.toTime(D.mins(it.startTime) + 60)).replace(':', '')}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(it.title)}&dates=${dates}&ctz=${encodeURIComponent(tz)}&details=${encodeURIComponent((it.notes || '') + '\n(from Life Hub)')}${it.location ? '&location=' + encodeURIComponent(it.location) : ''}`;
}
function icsEsc(v) { return String(v || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\;'); }
function icsFold(line) {
  if (line.length <= 75 && !/[^\x00-\x7f]/.test(line)) return line;
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line) { const n = enc.encode(ch).length; if (bytes + n > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; } cur += ch; bytes += n; }
  out.push(cur); return out.join('\r\n ');
}
function icsUtc(ms) { return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''); }
function wallMs(date, time, tz) { const [y, mo, d] = date.split('-').map(Number); const [h, mi] = String(time).split(':').map(Number); return ICal.wallToUtc(y, mo, d, h, mi || 0, 0, tz); }
/* Times are written in UTC, so Apple/Google/Outlook all place them correctly whatever their own time zone. */
function icsText(items, opts = {}) {
  const tz = D.tz(); const stamp = icsUtc(Date.now());
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Saahim Life Hub//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  if (opts.name) lines.push(`X-WR-CALNAME:${icsEsc(opts.name)}`, `X-WR-TIMEZONE:${tz}`, 'REFRESH-INTERVAL;VALUE=DURATION:PT15M', 'X-PUBLISHED-TTL:PT15M');
  items.forEach(it => {
    if (it.kind === 'ext') return;
    const d = it.date.replace(/-/g, ''); const title = (it.done ? '✓ ' : '') + it.title;
    lines.push('BEGIN:VEVENT', `UID:${it.kind}-${it.baseId}-${it.occKey || it.date}@lifehub`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(title)}`);
    if (it.allDay || !it.startTime) lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${D.add(it.date, 1).replace(/-/g, '')}`, 'TRANSP:TRANSPARENT');
    else { const s0 = wallMs(it.date, it.startTime, tz); let e0 = it.endTime ? wallMs(it.date, it.endTime, tz) : s0 + 3600000; if (!(e0 > s0)) e0 = s0 + 3600000; lines.push(`DTSTART:${icsUtc(s0)}`, `DTEND:${icsUtc(e0)}`); }
    if (it.location) lines.push(`LOCATION:${icsEsc(it.location)}`);
    const notes = opts.notes === false ? '' : (it.notes || (it.rec && it.rec.doc ? docText(it.rec, 'notes') : ''));
    const desc = [it.kind === 'due' ? 'Deadline' : it.kind === 'task' ? (it.dueToo ? 'Planned task — due today' : 'Planned task') : it.kind === 'publish' ? 'Publish date' : '', notes].filter(Boolean).join('\n');
    if (desc) lines.push(`DESCRIPTION:${icsEsc(desc.slice(0, 1500))}`);
    if (it.area) lines.push(`CATEGORIES:${icsEsc(areaLabel(it.area))}`);
    if (it.reminder != null && !it.done) {
      const n = Number(it.reminder) || 0; let trig;
      if (it.allDay || !it.startTime) { const off = 540 - n; trig = off >= 0 ? `PT${off}M` : `-PT${-off}M`; } else trig = n ? `-PT${n}M` : 'PT0M';
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(it.title)}`, `TRIGGER:${trig}`, 'END:VALARM');
    }
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR'); return lines.map(icsFold).join('\r\n') + '\r\n';
}

/* ---------- Apple Calendar: a private link your iPhone/Mac subscribes to ---------- */
const CalFeed = {
  STATUS: 'hub.calfeed', timer: null, busy: false, again: false,
  cfg() { const c = Settings.get().calFeed || {}; return { enabled: !!c.enabled, token: c.token || '', include: Object.assign({ tasks: true, due: true, publish: true, notes: false }, c.include || {}) }; },
  set(fields) { Settings.set({ calFeed: Object.assign(this.cfg(), fields) }); },
  ready() { return typeof Supa !== 'undefined' && Supa.signedIn() && !!(Supa.cfg() || {}).userId; },
  on() { const c = this.cfg(); return c.enabled && !!c.token && this.ready(); },
  status() { try { return JSON.parse(localStorage.getItem(this.STATUS) || '{}'); } catch (e) { return {}; } },
  setStatus(st) { try { localStorage.setItem(this.STATUS, JSON.stringify(st)); } catch (e) {} },
  objectPath(c) { return `calendar/${Supa.cfg().userId}/${(c || this.cfg()).token}.ics`; },
  httpsUrl(c) { return Supa.publicUrl(this.objectPath(c)); },
  webcalUrl(c) { return this.httpsUrl(c).replace(/^https:/i, 'webcal:'); },
  items() {
    const inc = this.cfg().include; const t = D.today();
    let to = D.add(t, 365); let list = calendarItems(D.add(t, -60), to, { noExt: true });
    if (list.length > 4000) { to = D.add(t, 150); list = list.filter(it => it.date <= to); }
    return list.filter(it => it.kind === 'event' || (it.kind === 'task' && inc.tasks) || (it.kind === 'due' && inc.due) || (it.kind === 'publish' && inc.publish));
  },
  text() { return icsText(this.items(), { name: 'Life Hub', notes: this.cfg().include.notes }); },
  schedule(ms = 5000) { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.publish(), ms); },
  async publish(opts = {}) {
    if (!this.on()) return false;
    if (this.busy) { this.again = true; return false; }
    this.busy = true; let ok = false;
    try {
      await Supa.upload(this.objectPath(), this.text(), 'text/calendar; charset=utf-8');
      this.setStatus({ at: Date.now(), error: '' }); ok = true;
      if (opts.announce) toast('Apple Calendar link updated');
    } catch (e) { console.warn('calendar link', e); this.setStatus(Object.assign(this.status(), { error: e.message || 'Upload failed', tried: Date.now() })); if (opts.announce) toast(e.message || 'Could not update the calendar link'); }
    this.busy = false; if (this.again) { this.again = false; this.schedule(1500); }
    if (opts.rerender) bump();
    return ok;
  },
  boot() {
    Store.listeners.push(c => { if (c === 'events' || c === 'tasks' || c === 'pieces') this.schedule(); });
    if (this.on()) { const st = this.status(); if (!st.at || Date.now() - st.at > 6 * 3600000 || st.error) setTimeout(() => this.publish(), 8000); }
  },
};
function newFeedToken() { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }

const INCOME_CATEGORIES = ['Stipend / salary', 'Scholarship', 'Teaching / RA', 'Gift received', 'Refund / reimbursement', 'Other income'];
const ACCOUNT_TYPES = ['Chequing', 'Savings', 'Credit card', 'Cash', 'Investment', 'Other'];
const BILL_FREQ = ['Monthly', 'Every 2 weeks', 'Weekly', 'Quarterly', 'Yearly'];
const categories = () => Settings.get().categories || DEFAULT_CATEGORIES;
const accountNames = () => Store.all('accounts').map(a => a.name);
const Fin = {
  month() { return UI.get('finMonth') || D.monthKey(D.today()); },
  tx(month) { return Store.all('transactions').filter(t => D.monthKey(t.date) === month); },
  signed(t) { return t.type === 'Expense' && t.refund ? -t.amount : t.amount; },
  totals(month) { const tx = Fin.tx(month); const income = tx.filter(t => t.type === 'Income').reduce((s, t) => s + (t.amount || 0), 0); const spending = tx.filter(t => t.type === 'Expense').reduce((s, t) => s + Fin.signed(t), 0); return { income, spending, net: income - spending, count: tx.length }; },
  catActual(month, cat) { return Fin.tx(month).filter(t => t.type === 'Expense' && t.category === cat).reduce((s, t) => s + Fin.signed(t), 0); },
  budgetId(month, cat) { return month + '_' + slug(cat); },
  budget(month, cat) { return Store.get('budgets', Fin.budgetId(month, cat)); },
  budgetRows(month) { return categories().map(cat => { const b = Fin.budget(month, cat); const planned = b ? (b.planned || 0) : 0; const actual = Fin.catActual(month, cat); return { cat, planned, actual, remaining: planned - actual, pct: planned ? actual / planned * 100 : 0, has: !!b }; }); },
  upcomingBills(days = 30) { const t = D.today(), e = D.add(t, days); return Store.all('bills').filter(b => b.active !== false && b.nextDate && b.nextDate <= e).sort(byKey('nextDate')); },
  advance(date, freq) { switch (freq) { case 'Weekly': return D.add(date, 7); case 'Every 2 weeks': return D.add(date, 14); case 'Quarterly': return D.monthStart(D.addMonths(D.monthKey(date), 3)).slice(0, 8) + date.slice(8); case 'Yearly': return (+date.slice(0, 4) + 1) + date.slice(4); default: { const k = D.addMonths(D.monthKey(date), 1); const last = D.monthEnd(k); const day = Math.min(+date.slice(8), +last.slice(8)); return k + '-' + pad(day); } } },
};

/* breakdown donuts: colour by size order (the validated palette sequence); a ranked list sits beside each */
function breakdownItems(obj, maxSlices = 5) {
  const arr = Object.entries(obj).filter(([, v]) => v > 0.004).sort((a, b) => b[1] - a[1]);
  const top = arr.slice(0, arr.length > maxSlices + 1 ? maxSlices : maxSlices + 1); const rest = arr.slice(top.length);
  const items = top.map(([k, v], i) => ({ label: k, value: v, color: Charts.SERIES[i] }));
  if (rest.length) items.push({ label: `Other (${rest.length})`, value: rest.reduce((a, [, v]) => a + v, 0), color: 'var(--c-other)' });
  return items;
}
function financeBreakdown(month) {
  const tx = Fin.tx(month); const exp = {}, inc = {};
  tx.filter(t => t.type === 'Expense').forEach(t => { exp[t.category] = (exp[t.category] || 0) + Fin.signed(t); });
  tx.filter(t => t.type === 'Income').forEach(t => { inc[t.category] = (inc[t.category] || 0) + (t.amount || 0); });
  const ei = breakdownItems(exp), ii = breakdownItems(inc);
  const card = (title, items, empty, center) => `<div class="card"><div class="card-head"><h3>${title}</h3><span class="small muted">${esc(D.monthLabel(month))}</span></div>${items.length ? Charts.donut(items, { fmt: money, centerLabel: center, label: title }) : `<div class="empty small">${icon('chart')}<p>${empty}</p></div>`}</div>`;
  return `<div class="grid grid-2">${card('Where the money went', ei, 'No spending recorded this month.', 'Spent')}${card('Where the money came from', ii, 'No income recorded this month.', 'Income')}</div>`;
}
function cashflowChart(month) {
  const months = Array.from({ length: 6 }, (_, i) => D.addMonths(month, i - 5)); const inc = [], sp = [];
  months.forEach(m => { const t = Fin.totals(m); inc.push(Math.round(t.income * 100) / 100); sp.push(Math.round(t.spending * 100) / 100); });
  if (!inc.some(Boolean) && !sp.some(Boolean)) return '';
  const short = m => MONTHS[+m.slice(5, 7) - 1].slice(0, 3);
  return `<div class="card">${Charts.bars({ x: months, series: [{ name: 'Income', values: inc, color: 'var(--c1)' }, { name: 'Spending', values: sp, color: 'var(--c2)' }], height: 210, padL: 52, xLabel: short, xTip: m => D.monthLabel(m), yFmt: v => v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'K' : '$' + Math.round(v), tipFmt: money, tipAll: true, label: 'Income and spending, last 6 months', table: { head: ['Month', { t: 'Income', r: 1 }, { t: 'Spending', r: 1 }, { t: 'Net', r: 1 }], rows: months.map((m, i) => [D.monthLabel(m), money(inc[i]), money(sp[i]), money(inc[i] - sp[i])]) } }, { title: 'Income vs spending', sub: 'Last six months (transfers excluded)' })}</div>`;
}

function sectionsDoc(sections) {
  const blocks = [];
  sections.forEach(([label, text, asTodos]) => {
    const t = String(text || '').trim(); if (!t) return;
    blocks.push({ type: 'h3', html: esc(label), indent: 0 });
    if (asTodos) t.split('\n').map(l => l.trim().replace(/^[-*•]\s*/, '').replace(/^\[( |x)\]\s*/i, '')).filter(Boolean).forEach(l => blocks.push({ type: 'todo', html: esc(l), checked: false, indent: 0 }));
    else Blocks.fromText(t).blocks.forEach(b => blocks.push(b));
  });
  return blocks.length ? { v: 1, blocks } : null;
}
